# TEMPORARY drop-in — delete when `ops/daily-snapshotter` merges to main.
#
# The checked-in unit points at /home/ubuntu/stock-manager, which is the authoritative repo and
# the only place this should run from long-term. But the job does not exist there until this
# branch merges, and the sources it captures lose a day of history for every day it does not run.
# So the schedule is pointed at the branch's worktree until the merge, and at nothing else:
# DATA_ROOT still names the authoritative lake, and the job asserts that before its first request.
#
# Install: ops/systemd/install.sh, then
#   install -m 0644 ops/systemd/pre-merge-drop-in.conf \
#     ~/.config/systemd/user/daily-snapshot.service.d/10-pre-merge.conf
#   systemctl --user daemon-reload
#
# On merge:
#   rm ~/.config/systemd/user/daily-snapshot.service.d/10-pre-merge.conf
#   systemctl --user daemon-reload
#   systemctl --user start daily-snapshot.service   # prove the merged path once, by hand

[Service]
Environment=SNAPSHOT_REPO=/home/ubuntu/wt/daily-snapshotter
ExecStart=
ExecStart=/home/ubuntu/wt/daily-snapshotter/ops/daily-snapshot.sh
