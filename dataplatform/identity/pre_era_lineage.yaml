# Reissues before the NSE ISIN era, linked by hand (M18.1; owner ruling 2026-11-23, HUMAN_DECISIONS D46).
#
# NSE's filing feeds (board meetings, announcements, shareholding) and its corporate-action feed
# state a company's *original* ISIN. When that ISIN was retired before 2011-06-22, the first NSE
# bhavcopy to print an ISIN, L1 price contiguity cannot derive the edge, so `filing_rekey` left the
# company's filings on a dead ISIN and the M17 dossiers showed no results date for it.
#
# Each entry becomes one MANUAL `isin_lineage` edge, written only by
#     uv run python -m dataplatform.identity.link_filing_history --apply
# which re-proves every entry from L0, L1 and the store first and writes nothing unless all pass
# (the proof is in that module's docstring). Remove an entry rather than weaken the proof.
#
# Fields:
#   symbol          the NSE symbol every L1 filing stated under old_isin names
#   old_isin        the ISIN the filings state; in no price row, no EQUITY_L capture, not in the master
#   successor_isin  what the symbol traded as from the reissue; serial = old serial + 1. Where it was
#                   itself reissued later (an L1 edge already stored), the edge lands on it and the
#                   chain carries the filing on to the live ISIN.
#   effective_date  the successor's first NSE session in L1, the lineage's own definition of an
#                   edge's date. Where a stored pre-era split dates the reissue, it is 4-6 sessions
#                   after that ex-date (the pre-ISIN resolver's settlement refusal).
#   provenance      who decided the link and when
#   note            the evidence summary, per name, as measured on 2026-11-25

version: 1

