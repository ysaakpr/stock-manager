# Index name history for the NSE daily close-all snapshot (`ind_close_all_<DDMMYYYY>.csv`).
#
# The file names each index in the form published *that day*, and NSE/IISL renamed essentially
# every index in a single event between 2015-11-06 and 2015-11-10 (48 names out of 53 changed in
# one step, verified by fetching both sides). A consumer that keys on today's name therefore loses
# every observation before that date — the same survivorship trap D2's `symbol_history` exists to
# close for equities, in the index dimension. This table is that history.
#
# Evidence discipline, deliberately conservative: a row exists only where the *name stem* matches
# and the closing level across the switch corroborates it, or where multi-year level continuity
# pins it by hand. Twenty-six pre-2015 names have neither and are **absent on purpose** — an
# unmapped name keeps its own published name as its canonical subject, so it forms a visibly
# separate series rather than being silently merged into the wrong index. Adding one is a research
# task with the evidence recorded here, never a guess.
#
# Provenance: dataplatform/ingest/macro (M11.1), probed 2026-09-04. Detail and the unmapped list:
# ops/gates/M11-macro-source-probe.md

version: 1
switch_event:
  observed_between: [2015-11-06, 2015-11-10]
  names_changed: 48
  names_unchanged: 5

aliases:
  - published: "S&P CNX Nifty"
    canonical: "Nifty 50"
    evidence: "flagship; level continuity 2012-10-01 5718.8 -> 2015-04-01 8586.25 -> 2017-01-02 8179.5"
  - published: "CNX Nifty"
    canonical: "Nifty 50"
