# Index name history for the NSE daily close-all snapshot (`ind_close_all_<DDMMYYYY>.csv`).
#
# The file names each index in the form published *that day*, and NSE/IISL renamed indices in
# several events: 'S&P' dropped from every CNX name on 2013-02-08, essentially every CNX name became
# a Nifty name between 2015-11-06 and 2015-11-09, the midcap/smallcap 100 indices split into
# free-float and full variants for FY2016-17 and FY2017-18, and smaller relabels since. A consumer
# that keys on today's name loses every observation before the switch — the survivorship trap D2's
# `symbol_history` closes for equities, in the index dimension. This table is that history.
#
# Two sections, and every name the M11.2 backfill ever saw in the archive is in one of them:
#
#   aliases — a published name that is the same index as a canonical one. Every row cites the two
#             dated L0 files that straddle the switch (`before` carries the predecessor name and
#             not the successor, `after` the successor and not the predecessor; both are frozen
#             under tests/fixtures/nifty_index_close/renames/), the first session under the new
#             name, and the measured levels. A row is admitted only where the closing level (and,
#             for equity indices, P/E, P/B and yield) continues across the switch and the successor
#             is the only name first published that session that does — or, for a series that
#             publishes no multiples, where the level replicates a mechanical rule (a leveraged or
#             inverse Nifty, a dividend-points index). A name is never mapped from string
#             similarity: "CNX Smallcap" -> "Nifty Smallcap 100" is here because P/B 1.00 continues
#             as 1.02, not because the words match.
#   series  — a published name that is its own index: new (first published with no stopped name it
#             continues) or retired (stopped with no successor). It resolves to itself.
#
# A name in neither section still resolves to itself, so it forms a visibly separate series; the
# backfill's coverage report lists it as unknown, and adding it here is a research task with the
# evidence recorded, never a guess.
#
# Two archive files are not what their date suggests: `ind_close_all_07072016.csv` and
# `ind_close_all_12042023.csv` were regenerated later with that day's values under *later* names
# (indices launched years afterwards appear in them). That is why some names below are first seen
# on those dates but published regularly only from a later one.
#
# Provenance: M11.1 (the 2015 switch, probed 2026-09-04: ops/gates/M11-macro-source-probe.md);
# widened in M11.3 from the M11.2 backfill's L0 and unknown-names report
# (ops/gates/M11-index-valuation-backfill.md). No fetch was made to build it.

