# NSE capital-market trading holidays and special sessions — the input to
# `dataplatform.ingest.calendar` (task C.2).
#
# What this file is for: an expected trading session is a weekday that is not in `holidays`. That
# turns "no bhavcopy for 2024-01-26" into GAP(expected) instead of a shrug, which is what makes the
# M1 gate's "gap report explains 100% of missing days" claim checkable.
#
# `special_session: MUHURAT` is the subtle case and the reason this file is not just a list of
# dates. On Diwali Laxmi Pujan the exchange is closed to normal trading — the NSE holiday master
# lists it as a holiday — but it holds a ~1 hour ceremonial session and **publishes a bhavcopy for
# that date, weekend or not**. All eleven Muhurat dates below were confirmed to return a bhavcopy
# (2016-10-30 Sun, 2019-10-27 Sun, 2020-11-14 Sat and 2023-11-12 Sun among them). So a Muhurat date
# is not an expected *session*, but it is an expected *file*; treating it as a plain holiday would
# silently skip a real trading day's data.
#
# Coverage is a hard boundary, not a default. `expected_sessions` refuses a range that leaves the
# span below rather than assuming an uncovered year has no holidays — an assumption that would
# quietly manufacture ~15 phantom sessions a year.
#
# Maintenance: NSE publishes the next year's list in ~December. Append a `years:` block and move
# `coverage.end`; both are checked at load, and a year with no holidays is rejected.

version: 1

coverage:
  start: 2016-01-01
  end: 2026-12-31

provenance:
  curated_by: "C.2"
  curated_on: "2026-08-08"
  method: |
    2026 is the exchange's own list, taken from the NSE holiday master
    (https://www.nseindia.com/api/holiday-master?type=trading, CM segment) on
    2026-08-08; it is complete, weekends included.
    2016-2025 could not be fetched — the master serves only the current year, and
    the per-symbol historical API is behind anti-bot (503), which AGENTIC_CONTEXT
    §8 forbids evading. Those years were instead *derived*: every weekday with no
    NIFTY 50 session is a closure candidate, and each candidate that disagreed
    with the curated expectation was resolved by fetching the date's bhavcopy from
    nsearchives directly (a 200 means the exchange traded, a 404 means it did
    not). Six such disagreements were checked and all six proved to be index-feed
    gaps on real trading days: 2016-01-01, 2016-08-12, 2018-01-01, 2019-01-01,
    2019-02-13, 2019-03-29. They are therefore absent below.
    Holiday *names* for 2016-2025 are curated, not sourced; a wrong name mislabels
    a gap-report line but cannot change which days are sessions.
  bhavcopy_probes: 21   # nsearchives, 3s spacing, well under the §3.3 bulk threshold
  known_limitation: |
    For source `derived_verified` years the weekday closures are complete (that is
    what the derivation sees) but holidays that fell on a weekend are not
    enumerated, because a non-session weekend is indistinguishable from a
    non-session weekend holiday. This costs nothing: both are already non-sessions,
    and Muhurat weekend dates — the only weekend entries that carry data — are
    listed explicitly. `source: nse_holiday_master` years are complete.
    The full cross-check against real bhavcopy availability for all ~2,700 weekdays
    is M1's backfill job: `TradingCalendar.reconcile` is the function it calls.

