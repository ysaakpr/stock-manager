# NSE capital-market trading holidays and special sessions — the input to
# `dataplatform.ingest.calendar` (task C.2).
#
# What this file is for: an expected trading session is a weekday that is not in `holidays`. That
# turns "no bhavcopy for 2024-01-26" into GAP(expected) instead of a shrug, which is what makes the
# M1 gate's "gap report explains 100% of missing days" claim checkable.
#
# `special_session: MUHURAT` is the subtle case and the reason this file is not just a list of
# dates. On Diwali Laxmi Pujan the exchange is closed to normal trading — the NSE holiday master
# lists it as a holiday — but it holds a ~1 hour ceremonial session and **publishes a bhavcopy for
# that date, weekend or not**. All eleven Muhurat dates below were confirmed to return a bhavcopy
# (2016-10-30 Sun, 2019-10-27 Sun, 2020-11-14 Sat and 2023-11-12 Sun among them). So a Muhurat date
# is not an expected *session*, but it is an expected *file*; treating it as a plain holiday would
# silently skip a real trading day's data.
#
# Coverage is a hard boundary, not a default. `expected_sessions` refuses a range that leaves the
# span below rather than assuming an uncovered year has no holidays — an assumption that would
# quietly manufacture ~15 phantom sessions a year.
#
# **Coverage was extended back to 2006-01-01 by W0-6 (2026-09-08).** That refusal above was the
# single blocker on any pre-2016 price backfill: the production legacy parser reads a 2011-06-22
# bhavcopy clean, so the constraint was this file, not parser code. Eight of the ten added years
# come from NSE's own published list for that year — a Capital Market circular where one survives,
# the exchange's own holiday page otherwise — and the two that do not (2012, 2013) had every
# weekday closure confirmed against the bhavcopy archive one date at a time. See `provenance`.
#
# Maintenance: NSE publishes the next year's list in ~December. Append a `years:` block and move
# `coverage.end`; both are checked at load, and a year with no holidays is rejected. Never widen
# `coverage` past a year you have not sourced — an invented list corrupts every future backfill's
# notion of a missing session, and unlike a loud refusal, nothing downstream can detect it.

version: 1

coverage:
  start: 2006-01-01
  end: 2026-12-31

provenance:
  curated_by: "C.2 + W0-6"
  curated_on: "2026-09-08"
  method: |
    Two curation passes, and each year's `source:` says which one established it.

    2016-2026 (C.2, 2026-08-08). 2026 is the exchange's own list, taken from the NSE holiday
    master (https://www.nseindia.com/api/holiday-master?type=trading, CM segment) on 2026-08-08;
    it is complete, weekends included. 2016-2025 could not be fetched — the master serves only
    the current year, and the per-symbol historical API is behind anti-bot (503), which
    AGENTIC_CONTEXT §8 forbids evading. Those years were instead *derived*: every weekday with no
    NIFTY 50 session is a closure candidate, and each candidate that disagreed with the curated
    expectation was resolved by fetching the date's bhavcopy from nsearchives directly (a 200
    means the exchange traded, a 404 means it did not). Six such disagreements were checked and
    all six proved to be index-feed gaps on real trading days: 2016-01-01, 2016-08-12,
    2018-01-01, 2019-01-01, 2019-02-13, 2019-03-29. They are therefore absent below.

    2006-2015 (W0-6, 2026-09-08). Same derivation, but published-list-first, and the derivation
    itself was validated before it was trusted. The session record is NSE Indices' own published
    NIFTY 50 daily history — one POST to
    https://niftyindices.com/BackPage/getHistoricaldatatabletoString for 01-Jan-2006..31-Dec-2015,
    2,480 sessions — and a weekday absent from it is a closure candidate. Run over 2016-2025
    first, that derivation reproduces C.2's verified list *exactly*, in both directions, for all
    ten years; only then was it applied to 2006-2015. Every year was then reconciled against a
    published record:

      2006  NSE holiday page for 2006 (captured 2006-11-06)          13/13 weekday dates agree
      2007  NSE circular NSE/F&O/083/2006 of 2006-12-07              12/12 agree
      2008  NSE circular NSE/CMO/063/2007 (CMTR/9908) of 2007-12-14  15/15 agree, +1 unscheduled
      2009  NSE circular NSE/CMO/054/2008 (CMTR/11733) of 2008-12-08 17/17 agree, +2 unscheduled
      2010  NSE CM circular no. 061 (dl. 13713) of 2009-12-17        10/10 agree
      2011  NSE holiday page for 2011 (captured 2011-10-02)          13/13 agree
      2012  no NSE publication located                              14/14 confirmed by bhavcopy
      2013  no NSE publication located                              13/13 confirmed by bhavcopy
      2014  NSE holiday page for 2014 (captured 2014-01-22)          16/16 agree, +2 unscheduled
      2015  NSE holiday page for 2015 (captured 2015-08-13)          14/14 agree

    The five "unscheduled" dates are in the session record but in no December circular, because
    they were declared later: 2008-11-27 (the 26/11 Mumbai attacks) and four election polling
    days (2009-04-30, 2009-10-13, 2014-04-24, 2014-10-15). Each was confirmed 404 against the
    bhavcopy archive rather than assumed. Per-year citations, with the exact archived URL, are
    the comment above each `years:` entry.

    Muhurat dates are the one thing the derivation cannot see — the exchange publishes an index
    value on a Muhurat day, so it looks like an ordinary session. All ten are taken from the
    published record, which marks them "Laxmi Puja *" with the Muhurat footnote; the three that
    fell on a weekend (2006-10-21, 2009-10-17, 2013-11-03) show up directly as weekend sessions
    in the index feed as well, and every one of the ten was confirmed to serve a bhavcopy.
  bhavcopy_probes: 91   # 21 by C.2 + 70 by W0-6; nsearchives, >=2.7s spacing, no bulk fetch
  known_limitation: |
    For source `derived_verified` and `derived_bhavcopy_verified` years the weekday closures are
    complete (that is what the derivation sees) but holidays that fell on a weekend are not
    enumerated, because a non-session weekend is indistinguishable from a non-session weekend
    holiday. This costs nothing: both are already non-sessions, and Muhurat weekend dates — the
    only weekend entries that carry data — are listed explicitly. `source: nse_holiday_master`
    years are complete. For `nse_published_list` years the exchange's own weekend list *was* read
    and is deliberately not transcribed, so that every year in this file is shaped the same way.
    The full cross-check against real bhavcopy availability for all ~2,700 weekdays is M1's
    backfill job: `TradingCalendar.reconcile` is the function it calls.

    **A gap this schema cannot express, found by W0-6 and left open deliberately.** NSE holds
    occasional non-Muhurat weekend sessions — Union Budget Saturdays, and live sessions run from
    the disaster-recovery site — and they publish a bhavcopy. Ten exist in 2006-2015 and every
    one was probed: 2006-04-29, 2006-06-25, 2010-02-06, 2012-01-07, 2012-03-03, 2012-04-28,
    2012-09-08, 2013-05-11, 2014-03-22 and 2015-02-28 all returned 200. The same is true inside
    the range this file already covered: 2020-02-01, 2024-05-18 and 2025-02-01 return 200 too.
    Such a date is not a holiday, so it cannot carry `special_session`, and `SpecialSession` has
    no member for it — so the calendar calls it WEEKEND and expects no data. `reconcile` cannot
    see the miss either, because nothing ever fetches those dates, so they never reach `observed`.
    Fixing it needs a new `SpecialSession` member and a way to declare a session on a non-holiday
    weekend, which is a change to calendar.py and outside W0-6's scope. Until then these sessions
    are silently absent from L0 — for the range already covered as much as for the new one.

