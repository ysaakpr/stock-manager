# Curated transcriptions of index-change releases that have no text layer — the input that lets
# `dataplatform.ingest.index_history` reconstruct across them. Read by
# `dataplatform.ingest.index_transcription`; checked by tests/unit/test_index_transcription.py.
#
# Why this file exists. `ind_prs23082021.pdf` (the September 2021 semi-annual review) draws every
# word as a 1-bit image mask — no text layer — and the box has no OCR. Until it was read, PR #37's
# history could not walk back past it (coverage started 2021-10-22 for every index). It was read
# here by an agent looking at the rendered pages, one by one, and typed in. No OCR was used and
# none was added: the page images were rasterised from the PDF's own mask images by a throwaway
# renderer (no dependency), then read visually.
#
# Rules for an entry (enforced by the loader and the tests):
#   * Provenance is the L0 object, pinned by `l0_key` and `sha256`. The builder applies a
#     transcription only when the object in L0 hashes to that sha — a re-issued PDF is a new
#     transcription, never a silent re-use of this one. L0 is never modified.
#   * Every row is [Sr. No., Company Name, Symbol] exactly as printed, including the release's own
#     spellings ("AstraZenca", "Railtel Corporation Of India") — a typo fixed here would be a
#     transcription that disagrees with its source.
#   * `pages` are 1-based PDF page numbers. `quote`s are verbatim from the page named.
#   * A section the source does not print completely is never filled from memory. Rows derived
#     rather than read are kept apart (`exclude_derived`/`include_derived`), carry no Sr. No., name
#     the `derivation` that produces them, and are re-derived by the tests from the transcribed
#     component sections — so a reviewer can tell at a glance what was read and what was computed.
#   * `flags` lists everything that did not read cleanly. An ambiguous entry is flagged, not guessed.

