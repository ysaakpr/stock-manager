# One-time re-queues of named XBRL filings — read by dataplatform.ingest.fundamentals_requeue and
# consumed by the scheduled `fundamentals_forward` job: the first scheduled run on or after
# `not_before` drives each filing once, under the job's own host leases, rate limiter and deadline,
# and writes the outcome to `fundamentals_requeue_log`. A filing with a journal row is never driven
# again. Nothing else fetches for these (AGENTIC_CONTEXT §8); an operator never fetches them by hand.
#
#   action: refetch          — the normal per-filing path, once: reuse L0, re-download a stored
#                              document that is empty or truncated (beside it), parse, publish or fail.
#   action: record_evidence  — NO request: re-read the entry from the stored index page and, if the
#                              index lists the XBRL file as zero bytes and the row is that document's
#                              404, re-record the failure with the index's statement (D31's evidence).
#
# Each filing names its sync_state unit, its filing (logical) date, and the L0 key of the stored
# index page its entry is re-read from (source/logical_date/filename) — no index request is made.
# Bounded: at most 50 filings a re-queue, 100 in the file. Public repository: no secret, no host.

version: 1

