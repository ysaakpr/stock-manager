      (total income is `Revenue`, the bottom line `ProfitLossForThePeriod`). Values are absolute
      rupees; `LevelOfRoundingUsedInFinancialStatements` (`Lakhs`/`Crores`/`Millions`) describes the
      printed statement and must not scale them.
