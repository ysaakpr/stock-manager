  # §4.1 row 1 — NSE equity OHLCV, pre-UDiFF era
  - id: nse_bhavcopy_legacy
    plan_row: "NSE equity OHLCV (≤ ~08-Jul-2024)"
    description: Legacy daily NSE cash-market bhavcopy, one zipped CSV per session.
    host: nsearchives.nseindia.com
    method: GET
    url_template: "https://nsearchives.nseindia.com/content/historical/EQUITIES/{YYYY}/{MON}/cm{DD}{MON}{YYYY}bhav.csv.zip"
    verified_url: "https://nsearchives.nseindia.com/content/historical/EQUITIES/2024/JAN/cm02JAN2024bhav.csv.zip"
    cadence: backfill_only
    era: {start: null, end: 2024-07-08}
    fallback: []
    required_headers:
      User-Agent: browser
      Referer: "https://www.nseindia.com/"
    needs_session_cookie: false
    parser: {id: dataplatform.ingest.nse.bhavcopy_legacy, task: M1.4}
    robots_notes: No directives on the archive host; www.nseindia.com allows /.
    pit_notes: >-
      Immutable once published. Carries ISIN directly, so it joins without a master — but only
      back to some point in the early 2010s. M1.4 fetched cm04JAN2010bhav.csv.zip from this same
      pattern and found an older sub-era: eleven columns, no TOTALTRADES and no ISIN. The M1.4
      parser refuses that header rather than emitting rows with no identity (invariant #2), so
      `era.start: null` above means "as far back as the 14-column format goes", not "all of it".
      Nothing needs the deeper history today: the C.2 calendar starts at 2016-01-01.
    status: VERIFIED
    verified_at: 2026-08-08T18:10:29+05:30
    last_http_status: 200
    sample_bytes: 100665
    content_type: application/zip
    sample_sha256: bc3f9ff6586c56248f2cfc678d7f873ac9c4a86f8a83395ebca2d91990157356
    parse_check: >-
      zip with one member cm02JAN2024bhav.csv; 14 columns; header
      SYMBOL,SERIES,OPEN,HIGH,LOW,CLOSE,LAST,PREVCLOSE,TOTTRDQTY,TOTTRDVAL,TIMESTAMP,
      TOTALTRADES,ISIN, (trailing comma is part of the format).
    fixture: {frozen: true, task: M1.4, path: "tests/fixtures/nse_bhavcopy/legacy/"}
    failure_note: null
    candidate_alternatives: []
    owner_task: M1.4

