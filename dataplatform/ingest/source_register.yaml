      the index says INE040A01018), so the ISIN comes from the index and only the symbol is
      cross-checked; (3) segments are `SegmentRevenue` under
      `in-bse-fin:ReportableSegmentsAxis` inside `xbrli:scenario` (not `xbrli:segment`), named by
      a sibling `DescriptionOfReportableSegment`, with the column embedded in the member name —
      and the column's own `SegmentRevenue` is the cross-segment *total*, not a segment;
      (4) three P&L vocabularies, selected by the `link:schemaRef` entry point (matched on the stem,
      so the version date is not part of the identity) — `Ind-AS_entry_point_*` and the NBFC
      `in-bse-fin-*` share one (`RevenueFromOperations`/`Income`/`Expenses`/`ProfitLossForPeriod`),
