# Source Register v1 — machine-readable mirror of EXECUTION_PLAN.md §4.1.
#
# Every field the engine consumes maps to a row in §4.1 and to at least one entry here.
# `status` in this file is a *fact about a real fetch*, not a plan aspiration: it is set by the
# C.1 verification sweep (2026-08-08) and every VERIFIED entry carries the status, size,
# content-type, checksum and structural parse of the response that earned it.
#
# Consumers: M1.2 (crawl policy engine) reads `host`, `required_headers`, `needs_session_cookie`
# and the `hosts:` block; the parser tasks named in `parser.task` read `url_template` and `era`.
# Nothing in this file is fetched by the test suite — tests assert its shape, never its hosts.
#
# Schema is enforced by dataplatform/ingest/source_register.py:
#   uv run python -m dataplatform.ingest.source_register validate

