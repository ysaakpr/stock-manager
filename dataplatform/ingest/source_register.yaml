      *undimensioned duration* contexts, conventionally `OneD` (the quarter) and `FourD` (the
      cumulative period), and they usually carry the **same** `xbrli:period` — the authoritative
      period of a column is the `DateOfStartOfReportingPeriod`/`DateOfEndOfReportingPeriod` facts
      reported *inside* it, so the index entry's `(fromDate, toDate)` is what picks the column;
      (2) the entity is identified by NSE **symbol**
      (`scheme=http://www.nseindia.com/NSESymbol`) — Ind-AS filings carry no ISIN element at all,
      and the banking taxonomy's can be stale (a captured HDFCBANK filing says INE040A01034 where
      the index says INE040A01018), so the ISIN comes from the index and only the symbol is
      cross-checked; (3) segments are `SegmentRevenue` under
      `in-bse-fin:ReportableSegmentsAxis` inside `xbrli:scenario` (not `xbrli:segment`), named by
      a sibling `DescriptionOfReportableSegment`, with the column embedded in the member name —
      and the column's own `SegmentRevenue` is the cross-segment *total*, not a segment;
      (4) three P&L vocabularies, selected by the `link:schemaRef` entry point (matched on the stem,
      so the version date is not part of the identity) — `Ind-AS_entry_point_*` and the NBFC
      `in-bse-fin-*` share one (`RevenueFromOperations`/`Income`/`Expenses`/`ProfitLossForPeriod`),
      `banking_entry_point_*` differs
      (`InterestEarned`/`ProfitLossForThePeriod`/`BasicEarningsPerShareAfterExtraordinaryItems`),
      and `other_than_banks_entry_point_*` — the pre-Ind-AS Indian-GAAP form — differs again
      (total income is `Revenue`, the bottom line `ProfitLossForThePeriod`). Values are absolute
      rupees; `LevelOfRoundingUsedInFinancialStatements` (`Lakhs`/`Crores`/`Millions`) describes the
      printed statement and must not scale them.
      Three further properties belong to the **older document generations** and were each found by
      sampling a filing per (financial year x taxonomy x bank flag) across the decade: (5) the
      2018-2022 `…_WEB.xml` files declare only their *dimensioned* contexts, leaving the table's
      own columns (`OneD`/`FourD`) undeclared — some declare no `<context>` at all, and so carry no
      `<xbrli:entity>` either, leaving the `Symbol` fact as their only stated identity; (6) those
      files also state no per-column reporting period, only a document-level
      `DateOfStartOfFinancialYear`/`DateOfEndOfFinancialYear` header pinned to `OneD` — it
      describes the *document*, and on an annual filing `OneD` is zero-filled while the year's
      numbers sit in the cumulative `FourD`, so reading the header as `OneD`'s period stores a
      company's revenue as zero; (7) some filings identify the entity by BSE scrip code
      (`scheme=…/bse-fin/ScripCode`) rather than NSE symbol, and a filing states the symbol it had
      *when filed*, so a since-renamed company only cross-checks against the D2 symbol history
      (Sastasundar Ventures files as `SASTASUNDR` under an entry that now reads `HEALTHX`).
      Known source gaps, both handled rather than fixed: a small number of index entries name a
      document the archive answers 404 for, and an annual-only document is sometimes listed under a
      fourth-quarter entry as well — the quarter is refused, because its start is stated nowhere in
      the document and storing twelve months under three would be silent.
    fixture: {frozen: true, task: M7.3, path: "tests/fixtures/xbrl/"}
