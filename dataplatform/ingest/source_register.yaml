    last_http_status: 200
    sample_bytes: 19935
    content_type: application/xml
    sample_sha256: 89651604c15397b2901204e86ac91d3a21feab6281f9ebe6d670288f5b85b84e
    parse_check: >-
      well-formed XBRL XML; root xbrli:xbrl with the in-bse-fin taxonomy namespaces (NSE serves
