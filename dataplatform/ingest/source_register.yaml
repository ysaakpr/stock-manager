sources:
  # §4.1 row 1 — NSE equity OHLCV, pre-UDiFF era
  - id: nse_bhavcopy_legacy
    plan_row: "NSE equity OHLCV (≤ ~08-Jul-2024)"
    description: Legacy daily NSE cash-market bhavcopy, one zipped CSV per session.
    host: nsearchives.nseindia.com
    method: GET
    url_template: "https://nsearchives.nseindia.com/content/historical/EQUITIES/{YYYY}/{MON}/cm{DD}{MON}{YYYY}bhav.csv.zip"
    verified_url: "https://nsearchives.nseindia.com/content/historical/EQUITIES/2024/JAN/cm02JAN2024bhav.csv.zip"
    cadence: backfill_only
    era: {start: null, end: 2024-07-08}
    fallback: []
    required_headers:
      User-Agent: browser
      Referer: "https://www.nseindia.com/"
    needs_session_cookie: false
    parser: {id: dataplatform.ingest.nse.bhavcopy_legacy, task: M1.4}
    robots_notes: No directives on the archive host; www.nseindia.com allows /.
    pit_notes: >-
      Immutable once published. Carries ISIN directly, so it joins without a master — but only
      back to some point in the early 2010s. M1.4 fetched cm04JAN2010bhav.csv.zip from this same
      pattern and found an older sub-era: eleven columns, no TOTALTRADES and no ISIN. The M1.4
      parser refuses that header rather than emitting rows with no identity (invariant #2), so
      `era.start: null` above means "as far back as the 14-column format goes", not "all of it".
      Nothing needs the deeper history today: the C.2 calendar starts at 2016-01-01.
    status: VERIFIED
    verified_at: 2026-08-08T18:10:29+05:30
    last_http_status: 200
    sample_bytes: 100665
    content_type: application/zip
    sample_sha256: bc3f9ff6586c56248f2cfc678d7f873ac9c4a86f8a83395ebca2d91990157356
    parse_check: >-
      zip with one member cm02JAN2024bhav.csv; 14 columns; header
      SYMBOL,SERIES,OPEN,HIGH,LOW,CLOSE,LAST,PREVCLOSE,TOTTRDQTY,TOTTRDVAL,TIMESTAMP,
      TOTALTRADES,ISIN, (trailing comma is part of the format).
    fixture: {frozen: true, task: M1.4, path: "tests/fixtures/nse_bhavcopy/legacy/"}
    failure_note: null
    candidate_alternatives: []
    owner_task: M1.4

  # §4.1 row 2 — NSE equity OHLCV, UDiFF era
  - id: nse_bhavcopy_udiff
    plan_row: "NSE equity OHLCV (UDiFF, ≥ Jul-2024)"
    description: UDiFF-format NSE cash-market bhavcopy — different schema, dual parser required.
    host: nsearchives.nseindia.com
    method: GET
    url_template: "https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_{YYYYMMDD}_F_0000.csv.zip"
    verified_url: "https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_20260807_F_0000.csv.zip"
    cadence: daily
    era: {start: 2024-07-08, end: null}
    fallback: ["samco.in mirror", "GetBhavcopy"]
    required_headers:
      User-Agent: browser
      Referer: "https://www.nseindia.com/"
    needs_session_cookie: false
    parser: {id: dataplatform.ingest.nse.bhavcopy_udiff, task: M1.5}
    robots_notes: No directives on the archive host; www.nseindia.com allows /.
    pit_notes: Immutable once published. ISIN present.
    status: VERIFIED
    verified_at: 2026-08-08T18:10:32+05:30
    last_http_status: 200
    sample_bytes: 194665
    content_type: application/zip
    sample_sha256: 33817d3100c82c3c90bc5349447cf04c749b07bf01b5a66260213ede0f7fab8b
    parse_check: >-
      zip with one member BhavCopy_NSE_CM_0_0_0_20260807_F_0000.csv; 34 columns; header starts
      TradDt,BizDt,Sgmt,Src,FinInstrmTp,FinInstrmId,ISIN,TckrSymb,SctySrs,... — confirms the
      schema break against the 14-column legacy era above.
    fixture: {frozen: true, task: M1.5, path: "tests/fixtures/nse_bhavcopy/udiff/"}
    failure_note: null
    candidate_alternatives: []
    owner_task: M1.5

  # §4.1 row 3 — NSE delivery %
  - id: nse_mto
    plan_row: "NSE delivery % (sec_bhavdata_full)"
    description: >-
      Security-wise delivery position (MTO). The older delivery report, and the only route to
      delivery figures before 2019-09-30, which is where sec_bhavdata_full's archive begins.
    host: nsearchives.nseindia.com
    method: GET
    url_template: "https://nsearchives.nseindia.com/archives/equities/mto/MTO_{DDMMYYYY}.DAT"
    verified_url: "https://nsearchives.nseindia.com/archives/equities/mto/MTO_07082026.DAT"
    cadence: daily
    # Serves at least 2016-01-04 (probed), which is before this platform's first price session
    # (2016-09-02), so the delivery history has no hole once both eras are used. W3's smoke
    # (2026-09-29) served 2011-06-22 .. 2016-09-01 samples; a 404 on a declared holiday
    # (2012-01-26) is the no-session signal, as for the bhavcopy.
    era: {start: null, end: null}
    fallback: []
    required_headers:
      User-Agent: browser
      Referer: "https://www.nseindia.com/"
    needs_session_cookie: false
    parser: {id: dataplatform.ingest.nse.mto, task: M1.6}
    robots_notes: No directives on the archive host.
    pit_notes: Immutable.
    status: VERIFIED
    verified_at: 2026-09-05T23:55:00+05:30
    last_http_status: 200
    sample_bytes: 118158
    content_type: text/plain
    sample_sha256: b8fe04bbb0d725abc0e11c2706e93600f959fcb44aa6e33291bc474a97c868e1
    parse_check: >-
      Fixed-shape comma-delimited text, not a CSV with a header row. Record type 10 is the header
      ("10,MTO,DDMMYYYY,<total>,<count>"), type 20 a security
      ("20,<sr>,<symbol>,<series>,<traded>,<delivered>,<pct>"). The column header names six fields
      and a data row carries seven — "Name of Security" is symbol AND series — so splitting on the
      header count shears the series off every row. No ISIN: joins on SYMBOL+SERIES and MUST be
      resolved through the D2 master before it touches anything (invariant #2).
      Cross-checked against nse_sec_bhavdata_full on 2026-08-07, a session both serve: every
      (symbol, series) key present in both reports an identical delivery quantity, and MTO values
      keys the modern file leaves blank while leaving none blank that it fills.
    fixture: {frozen: true, task: M1.6, path: "tests/fixtures/nse_mto/"}
    owner_task: M1.6
    failure_note: null

  - id: nse_sec_bhavdata_full
    plan_row: "NSE delivery % (sec_bhavdata_full)"
    description: Per-security delivery quantity and delivery percentage for one session.
    host: nsearchives.nseindia.com
    method: GET
    url_template: "https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_{DDMMYYYY}.csv"
    verified_url: "https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_07082026.csv"
    cadence: daily
    # Measured, not assumed. This read `{start: null}` — open-ended — until a backfill probed it:
    # this archive serves 2019-09-30 and 404s every session before it (binary search over
    # 2019-2021, 9 requests; 2019-09-27 is the last 404, and 09-28/29 are a weekend).
    #
    # That boundary is this *file's*, not delivery data's. An earlier version of this comment said
    # the 755 price sessions before it "can never carry delivery figures", which was wrong: it
    # generalised from one URL pattern to every route. `nse_mto` above serves the same facts for
    # those sessions and agrees with this file exactly where both exist.
    era: {start: 2019-09-30, end: null}
    fallback: []
    required_headers:
      User-Agent: browser
      Referer: "https://www.nseindia.com/"
    needs_session_cookie: false
    parser: {id: dataplatform.ingest.nse.delivery, task: M1.6}
    robots_notes: No directives on the archive host.
    pit_notes: Immutable.
    status: VERIFIED
    verified_at: 2026-08-08T18:10:34+05:30
    last_http_status: 200
    sample_bytes: 374452
    content_type: text/csv
    sample_sha256: 8b937105b230a12d50395b0c9e1f02fc1c39d611914988985c4a34bc5e7af06e
    parse_check: >-
      plain CSV, 15 columns, header
      "SYMBOL, SERIES, DATE1, PREV_CLOSE, OPEN_PRICE, HIGH_PRICE, LOW_PRICE, LAST_PRICE,
      CLOSE_PRICE, AVG_PRICE, TTL_TRD_QNTY, TURNOVER_LACS, NO_OF_TRADES, DELIV_QTY, DELIV_PER".
      Note the leading space in every field name after the first — the parser must strip.
      No ISIN column: this file joins on SYMBOL+SERIES and therefore MUST be resolved through
      the D2 identity master before it touches anything (invariant #2).
    fixture: {frozen: true, task: M1.6, path: "tests/fixtures/nse_delivery/"}
    failure_note: null
    candidate_alternatives: []
    owner_task: M1.6

  # §4.1 row 4 — BSE equity OHLCV (two eras)
  - id: bse_bhavcopy_udiff
    plan_row: "BSE equity OHLCV"
    description: BSE UDiFF cash-market bhavcopy, current era — same column schema as NSE UDiFF.
