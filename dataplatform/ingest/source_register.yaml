      sampling a filing per (financial year x taxonomy x bank flag) across the decade: (5) the
      2018-2022 `…_WEB.xml` files declare only their *dimensioned* contexts, leaving the table's
      own columns (`OneD`/`FourD`) undeclared — some declare no `<context>` at all, and so carry no
