# Curated, sourced corporate actions that neither CA feed carries, and the documented market moves
# that are not corporate actions at all. Read by dataplatform.corpactions.manual_actions; price
# events are composed into the factor chain by dataplatform.store.l2.materialize_isin, structural
# breaks mark the chain, and explained moves are honoured by dataplatform.quality.l2_continuity.
#
# Rules for a row (enforced by the loader and tests/unit/test_manual_actions.py):
#   * Every number and date is transcribed from the source quoted beside it. Nothing here is
#     derived from prices, and nothing is remembered: an event no source states is not entered,
#     and its step stays UNEXPLAINED.
#   * `isin` is the ISIN whose L2 partition carries the step: the D2 lineage survivor when the
#     ex-date bars sit under an ISIN a reissue retired, which `filed_against_isin` then names.
#   * `knowable_date` is the dissemination date of the earliest L0 source stating both the terms
#     and the ex-date, never the date this file was written. `checked` is when a human last
#     verified the row against its sources and against L1.
#   * SPLIT states face values `from_value` -> `to_value` (Rs 10 -> Rs 2 is a 1:5 sub-division);
#     BONUS states `new_shares` for every `held_shares` held. Two events on one ex-date are two
#     rows (the chain composes them). DEMERGER / SCHEME_OF_ARRANGEMENT carry no terms: they are
#     structural breaks, never a price factor.
#   * `sources[].l0_key` is the L0 object; `member`/`line` locate the text inside a PR bundle.
#     `line` is 1-BASED (`sed -n '<line>p'` prints it). `...` in a quote is an elision; every
#     fragment between them is verbatim on that line. The NSE book-closure file (Bc<ddmmyy>.csv)
#     columns are SERIES,SYMBOL,SECURITY,RECORD_DT,BC_STRT_DT,BC_END_DT,EX_DT,ND_STRT_DT,
#     ND_END_DT,PURPOSE.
#   * `explained_moves` are steps that are genuine price moves. They get no factor — that would
#     erase a real loss from every backtest — and match only their exact ISIN and session.

