# Curated, sourced terms for amalgamations and cash-exit delistings that leave a held name with no
# successor in the corporate_actions store (every stored MERGER row is UnquantifiedTerms and none
# names its transferee). Read by dataplatform.corpactions.merger_terms; applied to the backtest
# *book* only, by backtest.book_actions.
#
# Rules for a row (enforced by the loader and tests/unit/test_merger_terms.py):
#   * Every number is transcribed from the source quoted beside it. Nothing here is derived, and
#     nothing is remembered: a term no source states stays in `unsourced` with the reason.
#   * `knowable_date` is the dissemination date of the earliest source in L0 that states the
#     term, never the date this file was written.
#   * `record_date` (share swap) is the scheme's record date as the source states it; the book
#     applies the conversion then, or on the survivor's first priced session if that is later.
#   * `effective_date` (cash exit) is the date of delisting, which opens the exit window at the
#     stated exit price.
#   * Shares: `shares_received` of the surviving company for every `shares_held` of the old one,
#     in the source's own order (old -> new). Surviving ISINs are the company's current ISIN in the
#     D2 identity master; the book resolves the ISIN that was live on the record date through the
#     lineage chain (Grasim, Kotak and Tech Mahindra were reissued since).
#   * `sources[].l0_key` is the L0 object; `member`/`line` locate the text inside a PR bundle.
#     `line` is 1-BASED (`sed -n '<line>p'` prints it); `line_end` (inclusive) is set only where
#     the source hard-wraps the quoted sentence across lines. `...` in a quote is an elision;
#     every fragment between them is verbatim on those lines (tests/unit/test_merger_terms.py).

