# Accepted deviations — failures the owner has knowingly accepted. Read by
# dataplatform.status.deviations; validated at the status API's startup and by
# tests/unit/test_deviations.py, so a malformed entry fails the gate and the deploy, not a page.
#
# The owner's rule: an ERROR on the operator surfaces must mean something deviated from an agreed
# plan. An item an entry here recognises is shown as ACCEPTED (amber) with `remark` beside it, and
# its failure_alerts condition opens or stays at warning, never critical. Everything else stays red.
#
# DISPLAY AND ALERTING ONLY. Nothing here changes a gate: sync_state.is_green and "red data means
# no trading" (invariant #10), the kill switch, paper/M17 session gating, job_run's record of a run,
# and /health all ignore this file. An accepted item is still `healthy: false` on the JSON surface.
#
# Rules for an entry (enforced by the loader):
#   * `kind` + `target`: what it applies to — source (a sync_state source id), job (a registered
#     job), alert (an alert_condition dedup key), quality (a check name), gap (a source's
#     unexplained /status/gaps entries).
#   * `match` must recognise the known cause only. Never a name alone:
#       source   every FAILED row of the current failure streak is one of `errors` (and, with
#                `max_age_days`, dated within N days: a warning while retried, an error after);
#                a stuck row, a lag with no failures, or any other error keeps it red.
#       job      the newest finished run FAILED with one of `error_classes`, AND every condition
#                given: `legs` (the rows the run wrote on those sources are PUBLISHED/GAP or an
#                accepted `source` failure, at least one FAILED), `reported_legs` (the error's own
#                `source@date=STATE` list agrees), `published_on_run_date`, `error_pattern`,
#                `identity_conflicts` (a known set of open conflicts, by id and/or ISIN).
#       alert    `while_accepted`: the entry for the alert's subject accepts it right now.
#       quality  every open ERROR flag of the check is in the given set (fingerprints / ids /
#                isins / raised_before / dated_before — all given criteria hold for every flag).
#       gap      the entry's reason is in `reasons`, and its error / date is in the known set.
#     `errors` alternatives name the exception class read from the stored text's `ClassName: `
#     prefix (`class: null` for text stored without one), a regex searched in the message, and
#     optionally `dated_from`/`dated_to` (the row's logical date) for a cause true only then.
#   * `remark` is what the page shows. `basis` says who agreed, when, and where it is written down.
#   * `review_by` (optional): after that date the entry stops matching, the item turns red again and
#     the page says the acceptance expired. The seeds below carry none: the owner set no date.
#   * Public repository: no secret, no host or address of this deployment, no personal data.
#
# Adding an acceptance is a YAML edit here; it reaches the running API after the app container is
# rebuilt, and the failure_alerts evaluator after the scheduler restarts.

version: 1

# The 403 shapes the fetcher writes for api.bseindia.com (dataplatform/ingest/fetcher.py). Anchored
# on the exact wording, so a changed message — a new failure mode — turns the item red again.
x-bse-spike: &bse_spike
  class: ForbiddenSpikeError
  pattern: '^(?:ingestion from api\.bseindia\.com is hard-stopped after a 403 spike;|\d+ consecutive 403s from api\.bseindia\.com within )'

# BSE's soft block before the 403s: the scrip master answered an empty array, 2026-09-08..09-23.
# Accepted on those dates only; the same message on any other date is a new failure.
x-bse-soft-block: &bse_soft_block
  class: null
  pattern: '^bse_scrip_master: expected a non-empty JSON array'
  dated_from: 2026-09-08
  dated_to: 2026-09-23

x-bse-basis: &bse_basis
  agreed_by: owner
  agreed_on: 2026-10-12
  recorded_in:
    - "HUMAN_DECISIONS.md D26 (owner, 2026-10-12: 'Ignore BSE for now')"
    - "AGENTIC_CONTEXT.md §8: a 403 is never worked around (no user-agent rotation, no proxy)"

x-bse-remark: &bse_remark >-
  api.bseindia.com has refused this server (HTTP 403) since 2026-09-24; the owner chose on
  2026-10-12 to ignore BSE for now, and AGENTIC_CONTEXT §8 forbids working around a refusal.

# D27 (owner, 2026-10-24): the old cross-feed corporate-action disagreements, awaiting a human.
x-d27-basis: &d27_basis
  agreed_by: owner
  agreed_on: 2026-10-24
  recorded_in:
    - "HUMAN_DECISIONS.md D27 (owner, 2026-10-24: 'agree')"
    - "M2.3: a cross-feed disagreement is a human's adjudication, never resolved by code"

x-d27-remark: &d27_remark >-
  Cross-feed disagreement from before 2026-10-07, awaiting human adjudication (M2.3); accepted so
  it doesn't hide new ones.

# D28 (owner, 2026-10-24): failures still being retried show amber, red once 7 days old.
x-d28-basis: &d28_basis
  agreed_by: owner
  agreed_on: 2026-10-24
  recorded_in:
    - "HUMAN_DECISIONS.md D28 (owner, 2026-10-24: 'agree')"

x-d28-retrying: &d28_retrying
  days: 7

x-xbrl-retrying-errors: &xbrl_errors
  - class: FetchHTTPError
    pattern: '^nse_xbrl_filing: https://nsearchives\.nseindia\.com/corporate/xbrl/\S+\.xml returned 404\b'
  # The fundamentals backfill records a parse failure as `parse failed: <exc>`, with no class
  # prefix (dataplatform/ingest/fundamentals_backfill.py).
  - class: null
    pattern: '^parse failed: \S+\.xml: empty response body$'
  # A body cut off before its document closes: expat's end-of-input errors only (the four
  # `parser.payload_defect` calls truncated). Since 2026-11-01 a retry downloads such a document
  # again instead of re-parsing the stored bytes, so it really is retried. A document malformed any
  # other way is not this.
  - class: null
    pattern: '^parse failed: \S+\.xml: body is not well-formed XML: (?:no element found|unclosed token|partial character|unclosed CDATA section): line \d+, column \d+$'

# D31 (owner, 2026-11-01): NSE's own index lists the XBRL file as zero bytes. The runner appends
# the index's statement to the 404 it records (`fundamentals_backfill.zero_byte_evidence`), so the
# match is that recorded evidence, not a list: a filing the index states with any other size, or a
# 404 recorded without the statement, does not match.
x-d31-basis: &d31_basis
  agreed_by: owner
  agreed_on: 2026-11-01
  recorded_in:
    - "HUMAN_DECISIONS.md D31 (owner, 2026-11-01)"
    - "ops/BACKLOG.md M14.3 (XBRL) triage of PR #150"

x-d31-errors: &d31_errors
  - class: FetchHTTPError
    pattern: '^nse_xbrl_filing: https://nsearchives\.nseindia\.com/corporate/xbrl/\S+\.xml returned 404, which no retry would change; NSE''s index lists this XBRL file as ''0(?:\.0+)? ?(?:Bytes|B|KB|MB|GB)''$'

x-d31-remark: &d31_remark >-
  NSE's own filing index lists this XBRL file as 0 Bytes: the company filed only the inline-XBRL
  HTML, so there is no XBRL document to fetch (the archive answers 404). Accepted permanently.

# D32 (owner, 2026-11-01): every filing disseminated 2025-07-03 or 2025-07-04 answers 404; the
# days either side publish. Bounded by the row's logical (filing) date, and 404 only.
x-d32-basis: &d32_basis
  agreed_by: owner
  agreed_on: 2026-11-01
  recorded_in:
    - "HUMAN_DECISIONS.md D32 (owner, 2026-11-01)"
    - "ops/BACKLOG.md M14.3 (XBRL) triage of PR #150"

x-d32-errors: &d32_errors
  - class: FetchHTTPError
    pattern: '^nse_xbrl_filing: https://nsearchives\.nseindia\.com/corporate/xbrl/\S+\.xml returned 404, which no retry would change$'
    dated_from: 2025-07-03
    dated_to: 2025-07-04

x-d32-remark: &d32_remark >-
  NSE's archive serves no XBRL document for any filing disseminated on 2025-07-03 or 2025-07-04
  (404 for every one; the days either side publish). An outage at the source, accepted
  permanently.

x-gdelt-retrying-errors: &gdelt_errors
  - class: FetchHTTPError
    pattern: '^gdelt_v2_event_files: http://data\.gdeltproject\.org/gdeltv2/\d{14}\.export\.CSV\.zip returned 404\b'

deviations:
  # ── sources ─────────────────────────────────────────────────────────────────────────────────
  - id: bse-403-source-announcements
    kind: source
    target: bse_announcements
    match:
      errors:
        - class: ForbiddenError
          pattern: '^bse_announcements: https://api\.bseindia\.com/\S* returned 403 \('
        - *bse_spike
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-24

  - id: bse-403-source-corp-actions
    kind: source
    target: bse_corp_actions
    match:
      errors:
        - class: ForbiddenError
          pattern: '^bse_corp_actions: https://api\.bseindia\.com/\S* returned 403 \('
        - *bse_spike
        # The CA backfill records the unit that tripped the spike as str(spike), with no class
        # prefix (dataplatform/ingest/corp_actions_backfill.py).
        - class: null
          pattern: '^\d+ consecutive 403s from api\.bseindia\.com within '
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-24

  - id: bse-403-source-scrip-master
    kind: source
    target: bse_scrip_master
    match:
      errors:
        - class: ForbiddenError
          pattern: '^bse_scrip_master: https://api\.bseindia\.com/\S* returned 403 \('
        - *bse_spike
        - *bse_soft_block
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-08

  # ── jobs: mixed NSE + BSE runs, accepted only when every failed leg is an accepted BSE 403 ─────
  - id: bse-403-job-ca-refresh
    kind: job
    target: ca_refresh
    match:
      error_classes: [CaRefreshError]
      legs: [nse_corp_actions, bse_corp_actions]
      published_on_run_date: [nse_corp_actions/refresh]
    remark: >-
      NSE corporate actions refreshed and rebuilt; only BSE per-scrip requests were refused (403).
    basis: *bse_basis
    since: 2026-09-24

  - id: bse-403-job-announcements-capture
    kind: job
    target: announcements_capture
    match:
      error_classes: [DailyCaptureError]
      legs: [nse_announcements, bse_announcements]
      reported_legs: true
    remark: Only the BSE leg fails (403); NSE announcements land nightly.
    basis: *bse_basis
    since: 2026-09-24

  # ── the failure_alerts conditions of the same causes: warning, not critical ─────────────────
  - id: bse-403-alert-announcements-streak
    kind: alert
    target: ingest:bse_announcements:failed_streak
    match: {while_accepted: bse-403-source-announcements}
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-24

  - id: bse-403-alert-corp-actions-streak
    kind: alert
    target: ingest:bse_corp_actions:failed_streak
    match: {while_accepted: bse-403-source-corp-actions}
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-24

  - id: bse-403-alert-scrip-master-streak
    kind: alert
    target: ingest:bse_scrip_master:failed_streak
    match: {while_accepted: bse-403-source-scrip-master}
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-24

  - id: bse-403-alert-ca-refresh
    kind: alert
    target: job:ca_refresh:failed
    match: {while_accepted: bse-403-job-ca-refresh}
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-24

  - id: bse-403-alert-announcements-capture
    kind: alert
    target: job:announcements_capture:failed
    match: {while_accepted: bse-403-job-announcements-capture}
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-24

  # ── /status/gaps: the FAILED days those 403s left, one entry each, on the same evidence ─────
  - id: bse-403-gaps-announcements
    kind: gap
    target: bse_announcements
    match:
      reasons: [FAILED]
      errors:
        - class: ForbiddenError
          pattern: '^bse_announcements: https://api\.bseindia\.com/\S* returned 403 \('
        - *bse_spike
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-24

  - id: bse-403-gaps-corp-actions
    kind: gap
    target: bse_corp_actions
    match:
      reasons: [FAILED]
      errors:
        - class: ForbiddenError
          pattern: '^bse_corp_actions: https://api\.bseindia\.com/\S* returned 403 \('
        - *bse_spike
        - class: null
          pattern: '^\d+ consecutive 403s from api\.bseindia\.com within '
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-24

  - id: bse-403-gaps-scrip-master
    kind: gap
    target: bse_scrip_master
    match:
      reasons: [FAILED]
      errors:
        - class: ForbiddenError
          pattern: '^bse_scrip_master: https://api\.bseindia\.com/\S* returned 403 \('
        - *bse_spike
        - *bse_soft_block
    remark: *bse_remark
    basis: *bse_basis
    since: 2026-09-08

  # ── D27: ca_reconciliation ERROR flags raised before 2026-10-07, by frozen fingerprint ───────
  # The exact set, computed read-only on 2026-10-24 from the open ERROR flags raised before
  # 2026-10-07 IST (192): minus the 9 EX_DATE_MISMATCH (#133 fixes them), minus 147 dividend
  # RATIO_MISMATCH whose ex-date carries >=2 distinct dividend rows in one feed's own L0 payload
  # (the one-dividend-per-feed-per-day key drops the second; being fixed separately), minus 5 whose
  # stored row states two dividends in one line. A flag outside this list — any new disagreement —
  # stays red. Each line: fingerprint (detail->>'fingerprint'), reason, ISIN, ex-date.
  # 2026-11-01: 12 of the 31 removed, because code fixes resolved them and a fingerprint left here
  # would silently re-accept a regression that raised it again: 10 an NSE amount stated as
  # "<n> Per Share" with no currency marker, 2 "Special Interim Dividend" against BSE's interim
  # (M2.3). The 19 below are feed disagreements still awaiting a human.
  # 2026-11-01 (later): 17 more removed, resolved by the owner-approved rules for dividends the
  # feeds state consistently (M2.3): 12 NSE records stating no amount against BSE's (rule A,
  # silence yields), 4 equal money under different kind names (rule C) and ACC 2020-03-27, where
  # BSE was the silent side (rule A). The 2 left are genuine conflicts - different money -
  # awaiting a human: CORALFINAC (NSE Re 1 vs BSE Rs 0.20) and BEML (NSE Rs 12.28 vs BSE Rs 0.55).
  - id: d27-ca-reconciliation-backlog
    kind: quality
    target: ca_reconciliation
    match:
      fingerprints:
        - 69102f228404b6f9cbe237d4bf3d38b1  # RATIO_MISMATCH INE558D01021 2017-09-06
        - 8c8fac0ad26f33b777fc94552e9cabb0  # RATIO_MISMATCH INE258A01024 2026-09-22
    remark: *d27_remark
    basis: *d27_basis
    since: 2026-09-07
    review_by: 2027-01-31

  # The check's own alert is a warning only while every open ERROR flag is in the set above.
  - id: d27-ca-reconciliation-alert
    kind: alert
    target: quality:ca_reconciliation:red
    match: {while_accepted: d27-ca-reconciliation-backlog}
    remark: *d27_remark
    basis: *d27_basis
    since: 2026-09-07
    review_by: 2027-01-31

  # ── D31 / D32: XBRL filings NSE never published — permanent, by recorded evidence ──────────
  # Listed before D28 so that a zero-byte filing still inside its retry window shows why it will
  # stay amber rather than D28's "turns red after 7 days".
  - id: d31-xbrl-zero-byte-index
    kind: gap
    target: nse_xbrl_filing
    match:
      reasons: [FAILED]
      errors: *d31_errors
    remark: *d31_remark
    basis: *d31_basis
    since: 2025-11-04

  - id: d31-xbrl-zero-byte-index-source
    kind: source
    target: nse_xbrl_filing
    match:
      errors: *d31_errors
    remark: *d31_remark
    basis: *d31_basis
    since: 2025-11-04

  - id: d32-xbrl-july-2025-outage
    kind: gap
    target: nse_xbrl_filing
    match:
      reasons: [FAILED]
      errors: *d32_errors
    remark: *d32_remark
    basis: *d32_basis
    since: 2025-07-03

  - id: d32-xbrl-july-2025-outage-source
    kind: source
    target: nse_xbrl_filing
    match:
      errors: *d32_errors
    remark: *d32_remark
    basis: *d32_basis
    since: 2025-07-03

  # ── D28: failures still being retried — amber for 7 days from the first attempt, then red ───
  - id: d28-xbrl-filing-retrying
    kind: gap
    target: nse_xbrl_filing
    match:
      reasons: [FAILED]
      errors: *xbrl_errors
      retrying: *d28_retrying
    remark: >-
      NSE has not published this XBRL filing yet (404, or an empty or truncated body); it is
      retried, and turns red 7 days after its first attempt.
    basis: *d28_basis
    since: 2026-10-24

  - id: d28-xbrl-filing-retrying-source
    kind: source
    target: nse_xbrl_filing
    match:
      errors: *xbrl_errors
      retrying: *d28_retrying
    remark: >-
      Only filings NSE has not published yet (404, or an empty or truncated body), still within 7
      days of their first attempt.
    basis: *d28_basis
    since: 2026-10-24

  - id: d28-gdelt-retrying
    kind: gap
    # L0_PRESENT_L1_ABSENT too: before the unit-row L0 fix the same 404 carried that label.
    target: gdelt_v2_event_files
    match:
      reasons: [FAILED, L0_PRESENT_L1_ABSENT]
      errors: *gdelt_errors
      retrying: *d28_retrying
    remark: >-
      GDELT's manifest named an export file that does not exist (404); it is retried, and turns
      red 7 days after its first attempt.
    basis: *d28_basis
    since: 2026-10-24

  - id: d28-gdelt-retrying-source
    kind: source
    target: gdelt_v2_event_files
    match:
      errors: *gdelt_errors
      retrying: *d28_retrying
    remark: >-
      Only export files GDELT's manifest named but never served (404), still within 7 days of
      their first attempt.
    basis: *d28_basis
    since: 2026-10-24
