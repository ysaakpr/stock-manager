  # D35: the synthetic Apr->Mar `-FY` entry the index parser makes for every March-quarter record,
  # met by a company whose financial year starts in January, July or October. Shape: a `-FY` unit
  # asking Apr->Mar, every column the document offers ends on that 31 March and starts on the 1st
  # of January, July or October. A column starting any other day (ICICIPRULI's day/month-swapped
  # FY column) is a date typo, not this; and only filings dated 2025-04-21..2026-05-15 — a new one
  # stays red until reviewed.
  - id: d35-xbrl-synthetic-fy-non-march-year
    kind: gap
    target: nse_xbrl_filing
    match:
      reasons: [FAILED]
      errors:
        - class: null
          pattern: '^parse failed: \S+\.xml: no results column covers \d{4}-04-01→(?P<end>\d{4})-03-31 as the index entry \(IF\d+-FY\) says, and no single column ends on (?P=end)-03-31 either; the document offers (?:OneD|FourD)=\d{4}-(?:01|07|10)-01→(?P=end)-03-31/(?:Standalone|Consolidated)(?:, (?:OneD|FourD)=\d{4}-(?:01|07|10)-01→(?P=end)-03-31/(?:Standalone|Consolidated))?$'
          dated_from: 2025-04-21
          dated_to: 2026-05-15
    remark: >-
      Not a missing filing: our index parser adds an Apr-Mar annual entry (-FY) for every March
      quarter, but this company's financial year ends in December, June or September, so no
      document states an Apr-Mar year. The quarter is its own entry. Accepted (owner, 2026-11-02).
    basis: *d35_basis
    since: 2025-04-21

  # D36: the document is not the one the index entry names — another period's (a half-year on a
  # Q4 entry, the year-earlier quarter, VENKEYS' next quarter). Shape: the document offers a single
  # column, and it does not end on the date the entry asks for; filings dated 2025-05-05..09-16.
  - id: d36-xbrl-wrong-period-document
    kind: gap
    target: nse_xbrl_filing
    match:
      reasons: [FAILED]
      errors:
        - class: null
          pattern: '^parse failed: \S+\.xml: no results column covers \d{4}-\d\d-\d\d→(?P<end>\d{4}-\d\d-\d\d) as the index entry \(IF\d+(?:-FY)?\) says, and no single column ends on (?P=end) either; the document offers OneD=\d{4}-\d\d-\d\d→(?!(?P=end)/)\d{4}-\d\d-\d\d/(?:Standalone|Consolidated)$'
          dated_from: 2025-05-05
          dated_to: 2025-09-16
    remark: >-
      A correct refusal: the document attached to this index entry reports another period (a
      year-old quarter or half-year), so it cannot be filed as the period the entry names. The
      company's corrected filing carries the period. Accepted (owner, 2026-11-02).
    basis: *d36_basis
    since: 2025-05-05

  # D37: NSE's index files Dhunseri Tea's results (DTIL, INE341R01014) under Dhunseri Ventures
  # (DVL, INE477B01010). Shape: the index names DVL with DVL's ISIN and the document says DTIL;
  # filings dated up to 2025-05-23.
  - id: d37-xbrl-dtil-filed-as-dvl
    kind: gap
    target: nse_xbrl_filing
    match:
      reasons: [FAILED]
      errors:
        - class: null
          pattern: '^parse failed: \S+\.xml: index says this filing is ''DVL'' \(ISIN INE477B01010, symbols accepted on \d{4}-\d\d-\d\d: (?:DPL, )?DVL\) but the document says DTIL; the announcements index and the XBRL must name the same company$'
          dated_to: 2025-05-23
    remark: >-
      A correct refusal: NSE's index files this document under Dhunseri Ventures (DVL), but it is
      Dhunseri Tea's (DTIL, INE341R01014). Storing it would put one company's results under
      another's ISIN. Accepted (owner, 2026-11-02).
    basis: *d37_basis
    since: 2018-05-26

  # D38: paid-up capital stated in scientific notation with an impossible magnitude (ARE&M, LT);
  # each quarter is carried by the company's revised filing. Filings dated 2026-02-11..05-05.
  - id: d38-xbrl-scientific-notation
    kind: gap
    target: nse_xbrl_filing
    match:
      reasons: [FAILED]
      errors:
        - class: null
          pattern: '^parse failed: \S+\.xml: paid_up_equity_capital/None value ''\d\.\d+E\+\d+'' is not a plain decimal$'
          dated_from: 2026-02-11
          dated_to: 2026-05-05
    remark: >-
      A correct refusal: the document states paid-up capital in scientific notation at an
      impossible size (about 1e15 rupees); the company's revised filing for the same quarter
      carries the figures. Accepted (owner, 2026-11-02).
    basis: *d38_basis
    since: 2026-02-11

  # D39: index errors in the 2018-2023 results feed, accepted only where the same document landed
  # under its other index entry (`same_document_published`). Three shapes of the period stated a
  # year (or a quarter) stale or the old two-quarter `_WEB` layout under an Annual entry, filed
  # before 2021; and annual-only documents under a Quarterly entry, filed before 2024. The old
  # half-year shape (a Jul-Sep entry offered Apr-Sep, which today's parser would mis-store) is
  # none of these. A failure whose document no other entry published stays red.
  - id: d39-xbrl-old-index-period
    kind: gap
    target: nse_xbrl_filing
    match:
      reasons: [FAILED]
      before: 2021-01-01
      same_document_published: true
      errors:
        # the index's period is stale: the quarter column ends in another year
        - class: null
          pattern: '^parse failed: (?P<document>\S+\.xml): no results column covers \d{4}-\d\d-\d\d→(?P<y>\d{4})-(?P<md>\d\d-\d\d) as the index entry \(\d+\) says; the document offers OneD=\d{4}-\d\d-\d\d→(?!(?P=y)-)\d{4}-(?P=md)/(?P<n>Standalone|Consolidated), FourD=\d{4}-\d\d-\d\d→\d{4}-\d\d-\d\d/(?P=n)$'
        # old _WEB layout under an Annual entry: this year's and last year's Jan-Mar quarter only
        - class: null
          pattern: '^parse failed: (?P<document>\S+\.xml): no results column covers (?P<y0>\d{4})-04-01→(?P<y1>\d{4})-03-31 as the index entry \(\d+\) says; the document offers OneD=(?P=y1)-01-01→(?P=y1)-03-31/(?P<n>Standalone|Consolidated), FourD=(?P=y0)-01-01→(?P=y0)-03-31/(?P=n)$'
        # the index's quarter is one behind: an Apr-Jun entry offered Jul-Sep
        - class: null
          pattern: '^parse failed: (?P<document>\S+\.xml): no results column covers (?P<y>\d{4})-04-01→(?P=y)-06-30 as the index entry \(\d+\) says; the document offers OneD=(?P=y)-07-01→(?P=y)-09-30/(?P<n>Standalone|Consolidated), FourD=(?P=y)-04-01→(?P=y)-09-30/(?P=n)$'
        # ... and a Jul-Sep entry offered Oct-Dec
        - class: null
          pattern: '^parse failed: (?P<document>\S+\.xml): no results column covers (?P<y>\d{4})-07-01→(?P=y)-09-30 as the index entry \(\d+\) says; the document offers OneD=(?P=y)-10-01→(?P=y)-12-31/(?P<n>Standalone|Consolidated), FourD=(?P=y)-04-01→(?P=y)-12-31/(?P=n)$'
    remark: >-
      An index error, not missing data: NSE's 2018-2020 results feed asked this document for a
      period it does not hold, and the same document was published under its other index entry.
      Accepted (owner, 2026-11-02).
    basis: *d39_basis
    since: 2018-05-25

  - id: d39-xbrl-old-annual-only-document
    kind: gap
    target: nse_xbrl_filing
    match:
      reasons: [FAILED]
      before: 2024-01-01
      same_document_published: true
      errors:
        # a Jan-Mar Quarterly entry; the document holds only the Apr-Mar year ending that day
        - class: null
          pattern: '^parse failed: (?P<document>\S+\.xml): no results column covers (?P<y>\d{4})-01-01→(?P=y)-03-31 as the index entry \(\d+\) says; the document offers FourD=\d{4}-04-01→(?P=y)-03-31/(?:Standalone|Consolidated)$'
    remark: >-
      By design, not missing data: this document states only the full year, which was published
      under its Annual index entry; a Quarterly entry cannot take it. Accepted (owner, 2026-11-02).
    basis: *d39_basis
    since: 2018-05-25

  # ── D28: failures still being retried — amber for 7 days from the first attempt, then red ───
  - id: d28-xbrl-filing-retrying
    kind: gap
    target: nse_xbrl_filing
    match:
      reasons: [FAILED]
      errors: *xbrl_errors
      retrying: *d28_retrying
    remark: >-
      NSE has not published this XBRL filing yet (404, or an empty or truncated body); it is
      retried, and turns red 7 days after its first attempt.
    basis: *d28_basis
    since: 2026-10-24

  - id: d28-xbrl-filing-retrying-source
    kind: source
    target: nse_xbrl_filing
    match:
      errors: *xbrl_errors
      retrying: *d28_retrying
    remark: >-
      Only filings NSE has not published yet (404, or an empty or truncated body), still within 7
      days of their first attempt.
    basis: *d28_basis
    since: 2026-10-24

  - id: d28-gdelt-retrying
    kind: gap
    # L0_PRESENT_L1_ABSENT too: before the unit-row L0 fix the same 404 carried that label.
    target: gdelt_v2_event_files
    match:
      reasons: [FAILED, L0_PRESENT_L1_ABSENT]
      errors: *gdelt_errors
      retrying: *d28_retrying
    remark: >-
      GDELT's manifest named an export file that does not exist (404); it is retried, and turns
      red 7 days after its first attempt.
    basis: *d28_basis
    since: 2026-10-24

  - id: d28-gdelt-retrying-source
    kind: source
    target: gdelt_v2_event_files
    match:
      errors: *gdelt_errors
      retrying: *d28_retrying
    remark: >-
      Only export files GDELT's manifest named but never served (404), still within 7 days of
      their first attempt.
    basis: *d28_basis
    since: 2026-10-24
