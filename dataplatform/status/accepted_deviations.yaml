# Accepted deviations — failures the owner has knowingly accepted. Read by
# dataplatform.status.deviations; validated at the status API's startup and by
# tests/unit/test_deviations.py, so a malformed entry fails the gate and the deploy, not a page.
#
# The owner's rule: an ERROR on the operator surfaces must mean something deviated from an agreed
# plan. An item an entry here recognises is shown as ACCEPTED (amber) with `remark` beside it, and
# its failure_alerts condition opens or stays at warning, never critical. Everything else stays red.
#
# DISPLAY AND ALERTING ONLY. Nothing here changes a gate: sync_state.is_green and "red data means
# no trading" (invariant #10), the kill switch, paper/M17 session gating, job_run's record of a run,
# and /health all ignore this file. An accepted item is still `healthy: false` on the JSON surface.
#
# Rules for an entry (enforced by the loader):
#   * `kind` + `target`: what it applies to — source (a sync_state source id), job (a registered
#     job), alert (an alert_condition dedup key), quality (a check name), gap (a source's
#     unexplained /status/gaps entries).
#   * `match` must recognise the known cause only. Never a name alone:
#       source   every FAILED row of the current failure streak is one of `errors` (and, with
#                `max_age_days`, dated within N days: a warning while retried, an error after);
#                a stuck row, a lag with no failures, or any other error keeps it red.
#       job      the newest finished run FAILED with one of `error_classes`, AND every condition
#                given: `legs` (the rows the run wrote on those sources are PUBLISHED/GAP or an
#                accepted `source` failure, at least one FAILED), `reported_legs` (the error's own
#                `source@date=STATE` list agrees), `published_on_run_date`, `error_pattern`,
#                `identity_conflicts` (a known set of open conflicts, by id and/or ISIN).
#       alert    `while_accepted`: the entry for the alert's subject accepts it right now.
#       quality  every open ERROR flag of the check is in the given set (fingerprints / ids /
#                isins / kinds / raised_before / dated_before — all given criteria hold for every
#                flag; `kinds`, the finding's `detail->>'kind'`, never on its own).
#       gap      the entry's reason is in `reasons`, and its error / date / unit is in the known
#                set; `same_document_published` also requires another row of the source to be
#                PUBLISHED from the document the error names (its `(?P<document>...)` group).
#     `errors` alternatives name the exception class read from the stored text's `ClassName: `
#     prefix (`class: null` for text stored without one), a regex searched in the message, and
#     optionally `dated_from`/`dated_to` (the row's logical date) for a cause true only then.
#   * `remark` is what the page shows. `basis` says who agreed, when, and where it is written down.
#   * `review_by` (optional): after that date the entry stops matching, the item turns red again and
#     the page says the acceptance expired. The seeds below carry none: the owner set no date.
#   * Public repository: no secret, no host or address of this deployment, no personal data.
#
# Adding an acceptance is a YAML edit here; it reaches the running API after the app container is
# rebuilt, and the failure_alerts evaluator after the scheduler restarts.

version: 1

# The 403 shapes the fetcher writes for api.bseindia.com (dataplatform/ingest/fetcher.py). Anchored
# on the exact wording, so a changed message — a new failure mode — turns the item red again.
x-bse-spike: &bse_spike
  class: ForbiddenSpikeError
  pattern: '^(?:ingestion from api\.bseindia\.com is hard-stopped after a 403 spike;|\d+ consecutive 403s from api\.bseindia\.com within )'

# BSE's soft block before the 403s: the scrip master answered an empty array, 2026-09-08..09-23.
# Accepted on those dates only; the same message on any other date is a new failure.
x-bse-soft-block: &bse_soft_block
  class: null
  pattern: '^bse_scrip_master: expected a non-empty JSON array'
  dated_from: 2026-09-08
  dated_to: 2026-09-23

x-bse-basis: &bse_basis
