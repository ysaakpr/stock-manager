# Labelled sample for the M6.2 news→holding linkage precision/recall measurement.
#
# 60 hand-labelled news items over a fixed held universe of six securities (defined in
# tests/unit/test_linkage.py). Each item carries the ISINs it is genuinely *about* in `gold`; an
# empty `gold` is a distractor that must NOT link (it exists to measure precision). The universe:
#
#   INE009A01021  Infosys Limited                     NSE:INFY   BSE:INFY
#   INE066A01021  Eicher Motors Limited               NSE:EICHERMOT  BSE:EICHER   (Royal Enfield)
#   INE214T01019  LTIMindtree Limited                 NSE:LTIM   BSE:540005  (ex L&T Infotech, Mindtree)
#   INE002A01018  Reliance Industries Limited         NSE:RELIANCE  BSE:500325  (RIL)
#   INE467B01029  Tata Consultancy Services Limited   NSE:TCS    BSE:532540
#   INE423A01024  Adani Enterprises Limited           NSE:ADANIENT  BSE:512599
#
# The distractors are chosen to probe each precision guard: an ordinary word that is a company's
# first name ("Reliance on imported coal"), a shared industry word ("Motors and pumps"), a sibling
# entity that is not the holding ("Adani Ports", "Reliance General Insurance", "Larsen & Toubro"
# the parent vs "Larsen & Toubro Infotech" the former name), and a near-miss token
# ("Infosystems Global", "Mind the gap ... tree"). The misses (gold set, but no surface form present)
# are headlines that name a company only by description or by an un-curated short form — the deliberate
# recall cost of a precision-first matcher.

