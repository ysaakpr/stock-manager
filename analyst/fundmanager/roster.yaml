# M17 roster — the machine-readable form of
# ops/studies/preregistration-m17-ai-fund-managers-2026-10-09.md §2 as §8 Amendment 2 replaces it
# (four managers with distinct styles, each trading a primary ₹10 L and a mirror ₹1 cr book), §3
# and Amendment 2 (d) (a CTRL-<book> per manager book, a secondary STYLE-<manager> per manager,
# BENCH-N500) and §4 step 5 (rails). Loaded by analyst.fundmanager.load_roster.
#
# Frozen at S0 with the pre-registration: a changed manager is a NEW manager with a new id and its
# own clock (§7), never an edit of an existing entry.
#
# Units: money in rupees, percentages in percentage points (10 = 10 %), horizons in sessions.
# Write numbers as YAML integers or quoted decimal strings — a float is refused.
# Unknown keys, duplicate keys and duplicate ids are refused. A manager book's horizon is not
# written here: its style fixes it (mandate.FAMILY_HORIZON), and the loader checks every pairing
# (a manager's two books, each book's control, each manager's style book).

preregistration: ops/studies/preregistration-m17-ai-fund-managers-2026-10-09.md

rails:                              # §4 step 5, shared by every book
  participation_max_pct: 5          # order notional <= 5 % of the 20-session median traded value
  participation_lookback_sessions: 20
  min_hold_sessions: 2              # no sell within 2 sessions of the buy fill
  allow_short: false
  allow_fno: false
  allow_margin: false

books:
  # ── manager books (Amendment 2 a, b): <manager>-10L is the primary, <manager>-1CR the mirror ──
  - kind: MANAGER
    id: FM-SWING-BRK-10L
    manager: FM-SWING-BRK
    role: PRIMARY
    style: SWING_BREAKOUT                            # volume breakouts and pullbacks in leaders
    starting_screens: [S2, S3]
    opening_capital_inr: 1000000                     # ₹10,00,000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: &universe
      series: EQ
      min_median_traded_value_inr: 10000000          # ₹1 cr/day
      median_lookback_sessions: 20
      excluded_surveillance: [GSM, ESM]
      flagged_surveillance: [ASM]
    models: &models
      decision: claude-opus-5-5
      digest: claude-sonnet-5-5
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: &rounds
      max_isins: 12
      max_queries: 8
      max_research_rounds: 2

  - kind: MANAGER
    id: FM-SWING-BRK-1CR
    manager: FM-SWING-BRK
    role: MIRROR
    style: SWING_BREAKOUT
    starting_screens: [S2, S3]
    opening_capital_inr: 10000000                    # ₹1,00,00,000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe
    models: *models
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: *rounds

  - kind: MANAGER
    id: FM-SWING-EVT-10L
    manager: FM-SWING-EVT
    role: PRIMARY
    style: SWING_EVENT                               # results reactions and event drift
    starting_screens: [S4, S5]
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe
    models: *models
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: *rounds

  - kind: MANAGER
    id: FM-SWING-EVT-1CR
    manager: FM-SWING-EVT
    role: MIRROR
    style: SWING_EVENT
    starting_screens: [S4, S5]
    opening_capital_inr: 10000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe
    models: *models
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: *rounds

  - kind: MANAGER
    id: FM-POS-TREND-10L
    manager: FM-POS-TREND
    role: PRIMARY
    style: POSITIONAL_TREND                          # persistent trend and sector leadership
    starting_screens: [S1]
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe
    models: *models
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: *rounds

  - kind: MANAGER
    id: FM-POS-TREND-1CR
    manager: FM-POS-TREND
    role: MIRROR
    style: POSITIONAL_TREND
    starting_screens: [S1]
    opening_capital_inr: 10000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe
    models: *models
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: *rounds

  - kind: MANAGER
    id: FM-POS-FUND-10L
    manager: FM-POS-FUND
    role: PRIMARY
    style: POSITIONAL_FUNDAMENTAL                    # earnings inflection, quality, valuation
    starting_screens: [S4]                           # S4 + the fundamentals in every dossier
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe
    models: *models
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: *rounds

  - kind: MANAGER
    id: FM-POS-FUND-1CR
    manager: FM-POS-FUND
    role: MIRROR
    style: POSITIONAL_FUNDAMENTAL
    starting_screens: [S4]
    opening_capital_inr: 10000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe
    models: *models
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: *rounds

  # ── controls (§3, Amendment 2 d): per manager book, equal weight over the composite top 15 ──
  - kind: CONTROL
    id: CTRL-FM-SWING-BRK-10L
    controls_for: FM-SWING-BRK-10L
    shortlist_top_n: 15
    rebalance: &weekly {unit: WEEKLY, every: 1}
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: CONTROL
    id: CTRL-FM-SWING-BRK-1CR
    controls_for: FM-SWING-BRK-1CR
    shortlist_top_n: 15
    rebalance: *weekly
    opening_capital_inr: 10000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: CONTROL
    id: CTRL-FM-SWING-EVT-10L
    controls_for: FM-SWING-EVT-10L
    shortlist_top_n: 15
    rebalance: *weekly
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: CONTROL
    id: CTRL-FM-SWING-EVT-1CR
    controls_for: FM-SWING-EVT-1CR
    shortlist_top_n: 15
    rebalance: *weekly
    opening_capital_inr: 10000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: CONTROL
    id: CTRL-FM-POS-TREND-10L
    controls_for: FM-POS-TREND-10L
    shortlist_top_n: 15
    rebalance: &every21 {unit: SESSIONS, every: 21}
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: CONTROL
    id: CTRL-FM-POS-TREND-1CR
    controls_for: FM-POS-TREND-1CR
    shortlist_top_n: 15
    rebalance: *every21
    opening_capital_inr: 10000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: CONTROL
    id: CTRL-FM-POS-FUND-10L
    controls_for: FM-POS-FUND-10L
    shortlist_top_n: 15
    rebalance: *every21
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: CONTROL
    id: CTRL-FM-POS-FUND-1CR
    controls_for: FM-POS-FUND-1CR
    shortlist_top_n: 15
    rebalance: *every21
    opening_capital_inr: 10000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  # ── style books (Amendment 2 d, SECONDARY — reported, never used for pass/fail): ₹10 L, equal
  #    weight over up to 15 names of the manager's starting screens; an empty screen means cash ──
  - kind: STYLE
    id: STYLE-FM-SWING-BRK
    style_for: FM-SWING-BRK                          # S2 ∪ S3, ranked S2 first
    max_names: 15
    rebalance: *weekly
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: STYLE
    id: STYLE-FM-SWING-EVT
    style_for: FM-SWING-EVT                          # S4
    max_names: 15
    rebalance: *weekly
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: STYLE
    id: STYLE-FM-POS-TREND
    style_for: FM-POS-TREND                          # S1
    max_names: 15
    rebalance: *every21
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: STYLE
    id: STYLE-FM-POS-FUND
    style_for: FM-POS-FUND                           # S4 passing the playbook's quality filter
    max_names: 15
    rebalance: *every21
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  # ── the market (§3): buy-and-hold of the backtests' NIFTY 500 TRI proxy, from S0 ───────────
  # Return-only; the nominal capital just sizes the mark. M17.6 resolves `benchmark` to the
  # same proxy series the backtests use.
  - kind: BENCH
    id: BENCH-N500
    benchmark: nifty500-tri-proxy
    opening_capital_inr: 1000000
