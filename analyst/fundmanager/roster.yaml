# M17 roster — the machine-readable form of
# ops/studies/preregistration-m17-ai-fund-managers-2026-10-09.md §2 (managers), §3 (control and
# bench books) and §4 step 5 (rails). Loaded by analyst.fundmanager.load_roster.
#
# Frozen at S0 with the pre-registration: a changed manager is a NEW manager with a new id and its
# own clock (§7), never an edit of an existing entry.
#
# Units: money in rupees, percentages in percentage points (10 = 10 %), horizons in sessions.
# Write numbers as YAML integers or quoted decimal strings — a float is refused.
# Unknown keys, duplicate keys and duplicate ids are refused.

preregistration: ops/studies/preregistration-m17-ai-fund-managers-2026-10-09.md

rails:                              # §4 step 5, shared by every book
  participation_max_pct: 5          # order notional <= 5 % of the 20-session median traded value
  participation_lookback_sessions: 20
  min_hold_sessions: 2              # no sell within 2 sessions of the buy fill
  allow_short: false
  allow_fno: false
  allow_margin: false

books:
  # ── managers (§2) ──────────────────────────────────────────────────────────────────────────
  - kind: MANAGER
    id: FM-SWING-10L
    style: SWING
    horizon: {min_sessions: 5, max_sessions: 20}     # 1–4 weeks; guidance, not a rail
    opening_capital_inr: 1000000                     # ₹10,00,000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: &universe
      series: EQ
      min_median_traded_value_inr: 10000000          # ₹1 cr/day
      median_lookback_sessions: 20
      excluded_surveillance: [GSM, ESM]
      flagged_surveillance: [ASM]
    models: &models
      decision: claude-opus-5-5
      digest: claude-sonnet-5-5
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: &rounds
      max_isins: 12
      max_queries: 8
      max_research_rounds: 2

  - kind: MANAGER
    id: FM-SWING-1CR
    style: SWING
    horizon: {min_sessions: 5, max_sessions: 20}
    opening_capital_inr: 10000000                    # ₹1,00,00,000
    max_positions: 20
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe
    models: *models
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: *rounds

  - kind: MANAGER
    id: FM-POS-10L
    style: POSITIONAL
    horizon: {min_sessions: 20, max_sessions: 60}    # 1–3 months
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe
    models: *models
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: *rounds

  - kind: MANAGER
    id: FM-POS-1CR
    style: POSITIONAL
    horizon: {min_sessions: 20, max_sessions: 60}
    opening_capital_inr: 10000000
    max_positions: 20
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe
    models: *models
    prompt_path: analyst/fundmanager/prompts/manager.md
    rounds: *rounds

  # ── controls (§3): equal weight over the top N of the same shortlist, no LLM ───────────────
  - kind: CONTROL
    id: CTRL-FM-SWING-10L
    controls_for: FM-SWING-10L
    shortlist_top_n: 15
    rebalance: {unit: WEEKLY, every: 1}
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: CONTROL
    id: CTRL-FM-SWING-1CR
    controls_for: FM-SWING-1CR
    shortlist_top_n: 20
    rebalance: {unit: WEEKLY, every: 1}
    opening_capital_inr: 10000000
    max_positions: 20
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: CONTROL
    id: CTRL-FM-POS-10L
    controls_for: FM-POS-10L
    shortlist_top_n: 15
    rebalance: {unit: SESSIONS, every: 21}
    opening_capital_inr: 1000000
    max_positions: 15
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  - kind: CONTROL
    id: CTRL-FM-POS-1CR
    controls_for: FM-POS-1CR
    shortlist_top_n: 20
    rebalance: {unit: SESSIONS, every: 21}
    opening_capital_inr: 10000000
    max_positions: 20
    max_position_pct: 10
    max_sector_pct: 30
    universe: *universe

  # ── the market (§3): buy-and-hold of the backtests' NIFTY 500 TRI proxy, from S0 ───────────
  # Return-only; the nominal capital just sizes the mark. M17.6 resolves `benchmark` to the
  # same proxy series the backtests use.
  - kind: BENCH
    id: BENCH-N500
    benchmark: nifty500-tri-proxy
    opening_capital_inr: 1000000
