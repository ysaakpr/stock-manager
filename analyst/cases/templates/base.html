<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <!-- HTMX drives the edit round-trip in place (§8.1's "edit"); the page degrades to a full
         POST if the script is unavailable, so the flow never depends on JS being loaded. -->
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; line-height: 1.5; }
      h1 { margin-bottom: 0; }
      .muted { color: #666; }
      table { border-collapse: collapse; width: 100%; margin: 0.5rem 0 1.5rem; }
      th, td { border: 1px solid #ddd; padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
      th { background: #f5f5f5; }
      pre.policy { margin: 0; white-space: pre-wrap; font-size: 0.85rem; }
      .thesis { border: 1px solid #eee; border-radius: 6px; padding: 0.5rem 1rem; margin: 0.75rem 0; }
      .hash { font-family: ui-monospace, monospace; font-size: 0.85rem; word-break: break-all; }
      .message { background: #fffbe6; border: 1px solid #ffe58f; padding: 0.5rem 0.75rem; border-radius: 6px; }
      fieldset { margin: 1rem 0; }
      label { display: inline-block; min-width: 12rem; }
      button { padding: 0.4rem 0.9rem; }
    </style>
  </head>
  <body>
    {{body}}
  </body>
</html>
