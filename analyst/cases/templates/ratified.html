<div id="ratified">
  <h1>Ratified — {{case_id}}</h1>
  <p class="muted">Theme <b>{{theme}}</b></p>
  <p>Approved by <b>{{by}}</b> at {{at}} as <b>{{kind}}</b>.</p>
  <p>Pinned content hash:</p>
  <p class="hash">{{content_hash}}</p>
  <p class="muted">This record is the governance artifact: it pins the exact document approved, so a
    change to the proposal after this point is a new document requiring its own ratification.</p>
</div>
