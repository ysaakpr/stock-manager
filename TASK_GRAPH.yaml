# Autonomous build DAG for EXECUTION_PLAN.md
# Consumed by orchestrator/ (graph.py). Human-editable; agents append only via `orchestrator split`.
#
# autonomy: AUTO | NEEDS_GO | NEEDS_SECRET | HUMAN_GATE | GATE_AUDIT   (see AGENTIC_CONTEXT.md §4)
# Every task must be sized for one agent context. If it isn't, split it (AGENTIC_CONTEXT.md §7).

version: 1
plan: EXECUTION_PLAN.md
charter: AGENTIC_CONTEXT.md

milestones:
  M0: {title: Foundations, depends: []}
  M1: {title: NSE price core + 10y backfill, depends: [M0]}
  M2: {title: Corporate actions & adjustment engine, depends: [M1]}
  M3: {title: BSE + flows + F&O EOD, depends: [M1]}
  M4: {title: Query service + backtest engine, depends: [M2]}
  M5: {title: Analyst agent v1, paper mode, depends: [M4]}
  M6: {title: Monitoring depth T1/T2 + evidence packs, depends: [M5]}
  M7: {title: Fundamentals waterfall, depends: [M3]}
  M8: {title: Real-money readiness, depends: [M5, M6]}
  C:  {title: Continuous tracks (no gate), depends: []}

tasks:

# ─────────────────────────────────────────────────────────────────────────────
# M0 — Foundations
# ─────────────────────────────────────────────────────────────────────────────

- id: M0.1
  title: uv project skeleton, package layout, quality gate
  milestone: M0
  module: "—"
  autonomy: AUTO
  deps: []
  spec: |
    Create the Python 3.12 project with uv. pyproject.toml with deps: fastapi, uvicorn, pydantic,
    pydantic-settings, structlog, httpx, polars OR pandas+pyarrow (pick pandas+pyarrow — boring, #13),
    duckdb, psycopg[binary], apscheduler, typer, pyyaml, tenacity; dev: pytest, pytest-cov, ruff, mypy,
    types-pyyaml, freezegun, yfinance (test-only, for the M2 reference harness).
    Create every package dir from CLAUDE.md layout with __init__.py and a one-line module docstring naming
    its plan ID (e.g. "D1: ingestion + source register").
    Makefile targets: check (ruff format --check, ruff check, mypy, pytest), fmt, test, up, down, migrate,
    backup, restore. .gitignore covering data/, .env, __pycache__, .venv, *.parquet, .duckdb.
    ruff + mypy config in pyproject (line-length 100, strict-ish mypy, per-package overrides allowed).
  deliverables: [pyproject.toml, uv.lock, Makefile, .gitignore, "dataplatform/**/__init__.py", "analyst/**/__init__.py", tests/conftest.py]
  acceptance:
    - "uv sync creates a 3.12 venv and resolves the lock"
    - "make check passes on the empty skeleton (zero lint errors, mypy clean, pytest collects 0-or-more with no errors)"
    - "every package/subpackage in CLAUDE.md's layout exists with a docstring naming its plan module ID"
  verify: "uv run python -c 'import sys; assert sys.version_info[:2]==(3,12)' && make check"

- id: M0.2
  title: Config, logging, clock, path layout
  milestone: M0
  module: "—"
  autonomy: AUTO
  deps: [M0.1]
  spec: |
    dataplatform/config.py: pydantic-settings Settings reading .env — DB url, DATA_ROOT, timezone
    (Asia/Kolkata), rate limits, LLM/broker provider selectors ("stub" default per B4), log level.
    dataplatform/logging.py: structlog setup, JSON in prod / console in dev, bound context helper.
    dataplatform/clock.py: Clock protocol + SystemClock + FrozenClock (B10). NOTHING in the codebase may call
    datetime.now() after this exists — add a ruff/grep-based guard in tests asserting no direct
    datetime.now()/date.today() outside dataplatform/clock.py.
    dataplatform/store/paths.py: L0/L1/L2 path builders — L0 as
    data/L0/{source}/{yyyy}/{mm}/{filename}, L1 as data/L1/{dataset}/date={yyyy-mm-dd}/part.parquet, L2 mirror.
    .env.example with every key documented and no real values.
  deliverables: [dataplatform/config.py, dataplatform/logging.py, dataplatform/clock.py, dataplatform/store/paths.py, .env.example, tests/unit/test_clock_guard.py]
  acceptance:
    - "Settings loads from .env.example values with no network or DB access"
    - "FrozenClock makes a time-dependent function deterministic in a test"
    - "the clock guard test fails if a datetime.now() call is introduced anywhere outside dataplatform/clock.py (prove by temporarily adding one in the test)"
  verify: "uv run pytest tests/unit/test_clock_guard.py -q && make check"

- id: M0.3
  title: docker-compose stack + Dockerfile
  milestone: M0
  module: "—"
  autonomy: AUTO
  deps: [M0.1]
  spec: |
    ops/docker-compose.yml: postgres:16 (named volume, healthcheck, port 5432) + app service building
    ops/Dockerfile (python:3.12-slim, uv-based install, non-root user, runs the FastAPI status API).
    Wire DATA_ROOT as a bind mount so L0/L1/L2 live on the host. Makefile up/down/logs/psql targets.
    Keep it to two services (#13) — no redis, no nginx, no extras.
  deliverables: [ops/docker-compose.yml, ops/Dockerfile, ops/README.md]
  acceptance:
    - "docker compose up -d brings postgres to healthy and the app container to running"
    - "make psql opens a working shell against the container DB"
    - "app container reaches postgres by service name"
  verify: "docker compose -f ops/docker-compose.yml up -d && sleep 8 && docker compose -f ops/docker-compose.yml ps --format json | uv run python -c 'import sys,json; rows=[json.loads(l) for l in sys.stdin if l.strip()]; assert any(r[\"Service\"]==\"postgres\" for r in rows), rows'"

- id: M0.4
  title: Postgres schema v1 + migration runner
  milestone: M0
  module: D4
  autonomy: AUTO
  deps: [M0.2, M0.3]
  spec: |
    Plain SQL migrations (B6) in dataplatform/store/migrations/0001_init.sql + a ~50-line runner
    (dataplatform/store/migrate.py) tracking applied files in schema_migrations.
    Tables per §4.2 sketch, ISIN-keyed, with the append-only ones enforced by triggers or revoked
    UPDATE/DELETE grants where practical:
      security_master, symbol_history, exchange_listing, corporate_actions, adjustment_factors,
      sync_state(source,date,state,attempts,last_error,checksum), quality_flag,
      case_(config), policy_set(versioned, ratified_by, ratified_at), thesis(versioned),
      decision_journal(append-only), order_(staged/executed), token_usage.
    Comment every table with the plan module that owns it. Money columns NUMERIC, never float/double.
  deliverables: [dataplatform/store/migrations/0001_init.sql, dataplatform/store/migrate.py, dataplatform/store/db.py, tests/integration/test_migrations.py]
  acceptance:
    - "make migrate applies cleanly to an empty DB and is idempotent on a second run"
    - "decision_journal and policy_set reject UPDATE and DELETE (test asserts the failure)"
    - "no money column is float/double precision (test introspects information_schema)"
  verify: "make migrate && uv run pytest tests/integration/test_migrations.py -q"

- id: M0.5
  title: Status API skeleton (D5)
  milestone: M0
  module: D5
  autonomy: AUTO
  deps: [M0.4]
  spec: |
    FastAPI app in dataplatform/status/api.py exposing the §4.4 surface, returning real state from the DB
    (empty is fine, fabricated is not): /health (liveness + scheduler heartbeat age), /status/sync?date=,
    /status/sources, /status/gaps?from=&to=, /status/quality, /archives?date=.
    Pydantic response models — these are contracts other modules and the future product UI consume.
    /health returns 503 when the scheduler heartbeat is stale beyond a configured threshold.
  deliverables: [dataplatform/status/api.py, dataplatform/status/models.py, tests/integration/test_status_api.py]
  acceptance:
    - "all six endpoints return 200 with schema-valid empty payloads against a migrated empty DB"
    - "/health reports scheduler heartbeat age and flips to 503 when the heartbeat is stale"
    - "no endpoint returns hardcoded/sample data — every field traces to a query"
  verify: "uv run pytest tests/integration/test_status_api.py -q"

- id: M0.6
  title: Scheduler skeleton + job registry + heartbeat
  milestone: M0
  module: "—"
  autonomy: AUTO
  deps: [M0.4]
  spec: |
    APScheduler in-process (§8.1). dataplatform/scheduler/runner.py with a job registry (name, cron, fn,
    timeout, singleton lock via a DB advisory lock so two processes can't double-run an EOD job),
    heartbeat row written every tick, structured logging of job start/end/failure, and a
    `uv run python -m dataplatform.scheduler run-once <job>` entrypoint for manual/agent invocation.
    Register one placeholder job: eod_pipeline (no-op for now, real wiring in M1.11).
  deliverables: [dataplatform/scheduler/runner.py, dataplatform/scheduler/registry.py, tests/integration/test_scheduler.py]
  acceptance:
    - "run-once executes a registered job and writes a heartbeat visible via /health"
    - "the singleton lock prevents a second concurrent run of the same job (test proves it)"
    - "a job raising is logged, recorded as failed, and does not kill the scheduler"
  verify: "uv run pytest tests/integration/test_scheduler.py -q"

- id: M0.7
  title: Backup + restore scripts and executed drill
  milestone: M0
  module: "—"
  autonomy: AUTO
  deps: [M0.4]
  spec: |
    ops/backup.sh: pg_dump (custom format) + L0 manifest snapshot into ops/backups/<ts>/ with checksums.
    ops/restore.sh: restore into a scratch DB name and verify row counts against the manifest.
    Run the drill for real, capture the transcript into ops/runbooks/backup-restore.md with exact commands,
    expected output, and the recovery-time observed. §8.1 requires the drill executed once for the M0 gate.
    Object-storage upload is out of scope until a target exists — note that gap in the runbook.
  deliverables: [ops/backup.sh, ops/restore.sh, ops/runbooks/backup-restore.md]
  acceptance:
    - "backup.sh produces a dump + checksummed manifest"
    - "restore.sh restores into a scratch DB and verifies counts match"
    - "the runbook records an actually-executed drill with real output pasted, not a template"
  verify: "bash ops/backup.sh && bash ops/restore.sh --scratch"

- id: M0.8
  title: "GATE M0 — Foundations audit"
  milestone: M0
  module: "—"
  autonomy: GATE_AUDIT
  deps: [M0.5, M0.6, M0.7]
  spec: |
    Verify EXECUTION_PLAN.md M0's acceptance boxes independently, from a cold start:
    docker compose down -v, then up, migrate, hit /health and /status/sync, run the restore drill.
    Report pass/fail per box with captured evidence. Do not fix things here — file failures as FAILED
    on the responsible task so it retries with context.
  deliverables: [ops/gates/M0.md]
  acceptance:
    - "cold-start docker compose up reaches healthy with no manual steps beyond documented make targets"
    - "/health and an empty /status/sync return real state"
    - "backup + restore drill documented and executed"
  verify: "uv run python -m orchestrator gate M0"

# ─────────────────────────────────────────────────────────────────────────────
# C — Continuous / cross-cutting (start immediately, unblocks M1-M3)
# ─────────────────────────────────────────────────────────────────────────────

- id: C.1
  title: Source register (machine-readable) + live verification sweep
  milestone: C
  module: D1
  autonomy: AUTO
  deps: [M0.1]
  spec: |
    dataplatform/ingest/source_register.yaml — machine-readable mirror of §4.1: one entry per dataset with
    id, url_template, cadence, era ranges, fallback, robots notes, pit notes, status, verified_at,
    last_http_status, sample_bytes, content_type, parser id, required headers.
    Then VERIFY EACH ROW FOR REAL with a single polite request per pattern (2-3s spacing, browser UA,
    Referer https://www.nseindia.com/ for NSE, respect robots): NSE legacy bhavcopy, NSE UDiFF,
    sec_bhavdata_full, BSE bhavcopy, NSE + BSE corp actions, EQUITY_L.csv, BSE scrip master,
    niftyindices constituent CSVs + TRI, FII/DII, bulk/block deals, F&O bhavcopy, announcements feeds,
    GDELT. Flip status to VERIFIED with evidence, or record the exact failure and a candidate alternative.
    Total requests must stay well under the B1 bulk threshold (~one per pattern, ~20 requests).
    AGENTIC_CONTEXT.md §8 records the three NSE patterns already confirmed — re-confirm, don't assume.
  deliverables: [dataplatform/ingest/source_register.yaml, ops/gates/source-verification.md]
  acceptance:
    - "every §4.1 row has an entry; each carries verified_at, last_http_status and sample_bytes or an explicit failure note"
    - "no row is marked VERIFIED without a real successful fetch recorded"
    - "robots.txt was checked per host and the register records what it permits"
  verify: "uv run python -m dataplatform.ingest.source_register validate"

- id: C.2
  title: NSE trading calendar (expected sessions)
  milestone: C
  module: D1
  autonomy: AUTO
  deps: [M0.2]
  spec: |
    dataplatform/ingest/calendar.py: expected trading sessions for a date range = weekdays minus exchange
    holidays. Holidays from a checked-in YAML (dataplatform/ingest/data/nse_holidays.yaml) covering the last
    10 years + current year, sourced from the NSE holiday master if fetchable, else curated and then
    validated against actual bhavcopy availability during backfill.
    This is what makes the M1 gate's "gap report explains 100% of missing days" claim checkable — a
    missing day is either GAP(expected) or a real failure, never a shrug.
  deliverables: [dataplatform/ingest/calendar.py, dataplatform/ingest/data/nse_holidays.yaml, tests/unit/test_calendar.py]
  acceptance:
    - "expected_sessions(2016-01-01..2026-08-07) excludes weekends and every listed holiday"
    - "known spot checks pass: Republic Day, Diwali/Muhurat handling, Good Friday, a mid-week holiday"
    - "unknown future years fail loud rather than silently assuming no holidays"
  verify: "uv run pytest tests/unit/test_calendar.py -q"

- id: C.3
  title: Alerting channel (email/Telegram) with stub default
  milestone: C
  module: "—"
  autonomy: AUTO
  deps: [M0.2]
  spec: |
    dataplatform/alerts.py: Alerter protocol (send(severity, title, body, dedup_key)) with LogAlerter (default,
    no credentials — B4), plus EmailAlerter and TelegramAlerter implementations behind config that raise a
    clear "credential not configured" error rather than failing silently.
    Dedup so a 5-day failure streak doesn't send 500 alerts. §8.1 observability requirement.
  deliverables: [dataplatform/alerts.py, tests/unit/test_alerts.py]
  acceptance:
    - "LogAlerter is the default and requires no credentials"
    - "dedup_key suppresses repeats within a configurable window"
    - "an unconfigured Email/Telegram alerter raises a named, actionable error"
  verify: "uv run pytest tests/unit/test_alerts.py -q"

# ─────────────────────────────────────────────────────────────────────────────
# M1 — NSE price core
# ─────────────────────────────────────────────────────────────────────────────

- id: M1.1
  title: L0 raw store (immutable, checksummed)
  milestone: M1
  module: D1
  autonomy: AUTO
  deps: [M0.2]
  spec: |
    dataplatform/store/l0.py: put(source, logical_date, filename, bytes) -> L0Ref with sha256, size,
    fetched_at, content_type, and a sidecar .meta.json. Write-once: a second put of identical content is a
    no-op; a put of DIFFERENT content for an existing key raises L0ImmutabilityError (never overwrite).
    get/open by ref, iterate by (source, date range), verify_checksums() sweep.
    Invariant #1 lives here — this module is the reason every L1/L2 value is re-derivable.
  deliverables: [dataplatform/store/l0.py, tests/unit/test_l0.py]
  acceptance:
    - "put is idempotent for identical content and raises on conflicting content for the same key"
    - "no code path in l0.py can modify or delete an existing payload"
    - "verify_checksums detects a corrupted file"
  verify: "uv run pytest tests/unit/test_l0.py -q"

- id: M1.2
  title: Crawl policy engine (D1 core)
  milestone: M1
  module: D1
  autonomy: AUTO
  deps: [M1.1, C.1, C.3]
  spec: |
    dataplatform/ingest/fetcher.py: per-source policy from source_register.yaml — browser UA, Referer, warm
    session cookie for NSE (visit www.nseindia.com first, reuse cookies), 2-3s minimum spacing per host,
    tenacity exponential backoff on 5xx/timeouts, HARD STOP + alert on a 403 spike (configurable
    threshold, e.g. 3 in a window) rather than any evasion, respect robots per §4.1/AGENTIC_CONTEXT §8.
    Every response body lands in L0 before any parsing. Returns L0Ref, never parsed data.
    Offline test mode: a recorded-response transport so tests never hit the network (B8).
  deliverables: [dataplatform/ingest/fetcher.py, dataplatform/ingest/policy.py, tests/unit/test_fetcher.py]
  acceptance:
    - "rate limiter enforces the per-host minimum spacing (test with a fake clock)"
    - "403 spike trips a hard stop and emits an alert; no retry-with-different-UA behaviour exists"
    - "every successful fetch is in L0 with a checksum before the caller sees it"
    - "tests pass with no network access"
  verify: "uv run pytest tests/unit/test_fetcher.py -q"

- id: M1.3
  title: Sync state machine (D5 core)
  milestone: M1
  module: D5
  autonomy: AUTO
  deps: [M0.4, C.2]
  spec: |
    dataplatform/status/sync_state.py implementing §4.4 exactly: PENDING → FETCHED → VALIDATED → NORMALIZED →
    PUBLISHED, with FAILED(retryable, attempts, last_error) and GAP(expected) branches.
    Illegal transitions raise. Per-(source, date) row in sync_state; attempts and last_error preserved.
    Expose is_green(date, datasets) — the single function the agent's daily loop and the trading interlock
    (§4.4, invariant #10) call. Wire the real values into /status/sync and /status/sources.
  deliverables: [dataplatform/status/sync_state.py, tests/unit/test_sync_state.py, tests/integration/test_status_sync.py]
  acceptance:
    - "every legal transition works; every illegal transition raises with both states named"
    - "GAP(expected) is set for holidays/weekends from the C.2 calendar, never for a real miss"
    - "/status/sync?date= reflects real rows; /status/sources reports last success, lag, failure streak"
  verify: "uv run pytest tests/unit/test_sync_state.py tests/integration/test_status_sync.py -q"

- id: M1.4
  title: NSE legacy bhavcopy parser (pre-Jul-2024)
  milestone: M1
  module: D1
  autonomy: AUTO
  deps: [M1.2]
  spec: |
    Parse cm{DD}{MON}{YYYY}bhav.csv.zip → canonical price rows. Columns: SYMBOL, SERIES, OPEN, HIGH, LOW,
    CLOSE, LAST, PREVCLOSE, TOTTRDQTY, TOTTRDVAL, TIMESTAMP, TOTALTRADES, ISIN.
    Freeze fixtures for at least 3 dates spanning the era (early, mid, just before the Jul-2024 cutover),
    fetched via M1.2 so they are real files. Decimal for prices. Keep SERIES (EQ/BE/BZ/SM/ST...) — do not
    filter to EQ here; filtering is a query concern.
    Emit a typed row model shared with M1.5 so both eras converge on one schema.
  deliverables: ["dataplatform/ingest/nse/bhavcopy_legacy.py", dataplatform/ingest/models.py, "tests/fixtures/nse_bhavcopy/legacy/", tests/unit/test_bhavcopy_legacy.py]
  acceptance:
    - "3+ real fixture files across the era parse to identical row schema with Decimal prices"
    - "row counts and a hand-checked sample row match the raw CSV exactly"
    - "malformed/truncated input raises a specific parse error naming the file and line"
  verify: "uv run pytest tests/unit/test_bhavcopy_legacy.py -q"

- id: M1.5
  title: NSE UDiFF bhavcopy parser (Jul-2024+)
  milestone: M1
  module: D1
  autonomy: AUTO
  deps: [M1.4]
  spec: |
    Parse BhavCopy_NSE_CM_0_0_0_{YYYYMMDD}_F_0000.csv.zip (UDiFF/ISO-20022-flavoured columns:
    TradDt, BizDt, Sgmt, Src, FinInstrmTp, FinInstrmId, ISIN, TckrSymb, SctySrs, OpnPric, HghPric, LwPric,
    ClsPric, LastPric, PrvsClsgPric, TtlTradgVol, TtlTrfVal, TtlNbOfTxsExctd, ...) into the SAME row model
    as M1.4. Dual-parser dispatch by date/era in dataplatform/ingest/nse/bhavcopy.py.
    Freeze 2+ real fixtures. Prove era continuity: for a symbol present on both sides of the cutover, the
    parsed schema and semantics are identical (§4.1 "dual parser required").
  deliverables: ["dataplatform/ingest/nse/bhavcopy_udiff.py", dataplatform/ingest/nse/bhavcopy.py, "tests/fixtures/nse_bhavcopy/udiff/", tests/unit/test_bhavcopy_udiff.py]
  acceptance:
    - "UDiFF fixtures parse into the M1.4 row model with no era-specific fields leaking out"
    - "the dispatcher picks the right parser by date, including at the exact cutover boundary"
    - "a cross-era continuity test asserts identical semantics for a symbol present in both formats"
  verify: "uv run pytest tests/unit/test_bhavcopy_udiff.py -q"

- id: M1.6
  title: sec_bhavdata_full parser (delivery %)
  milestone: M1
  module: D1
  autonomy: AUTO
  deps: [M1.4]
  spec: |
    Parse sec_bhavdata_full_{DDMMYYYY}.csv → delivery quantity and delivery percentage per symbol/series.
    Note the file's leading-space column names and that delivery fields are '-' for some series — model
    that as None, never 0 (a zero would silently corrupt delivery-spike detection in T0 monitoring).
    Freeze 2+ real fixtures including one with '-' values.
  deliverables: ["dataplatform/ingest/nse/delivery.py", "tests/fixtures/nse_delivery/", tests/unit/test_delivery.py]
  acceptance:
    - "delivery qty/pct parse correctly; '-' becomes None and is distinguishable from 0"
    - "column-name whitespace handled without brittle positional indexing"
    - "join key is (symbol, series, date) and resolves to ISIN via the identity master, not by symbol alone"
  verify: "uv run pytest tests/unit/test_delivery.py -q"

- id: M1.7
  title: Identity master v1 (D2)
  milestone: M1
  module: D2
  autonomy: AUTO
  deps: [M0.4, M1.2]
  spec: |
    dataplatform/identity/: ingest NSE EQUITY_L.csv + symbol change history, build ISIN-keyed security_master
    with symbol_history (symbol, from_date, to_date), exchange_listing rows, series, status
    (ACTIVE/SUSPENDED/DELISTED). resolve(symbol, on_date) -> ISIN and resolve(isin) -> symbol as-of.
    Never overwrite history — a symbol change appends (§4.1). A symbol resolving to two ISINs on one date is
    a hard error surfaced to a reconciliation queue, not a silent pick.
    Invariant #2 is enforced here: this is the only legitimate symbol→ISIN path in the codebase.
  deliverables: [dataplatform/identity/master.py, dataplatform/identity/ingest.py, tests/unit/test_identity.py, tests/integration/test_identity_ingest.py]
  acceptance:
    - "resolve(symbol, date) returns the correct ISIN across a real symbol-change case"
    - "re-ingesting the master is idempotent and never loses prior symbol history"
    - "an ambiguous symbol→ISIN mapping raises and lands in the reconciliation queue"
  verify: "uv run pytest tests/unit/test_identity.py tests/integration/test_identity_ingest.py -q"

- id: M1.8
  title: L1 canonical writer (prices_raw parquet)
  milestone: M1
  module: D4
  autonomy: AUTO
  deps: [M1.5, M1.6, M1.7]
  spec: |
    dataplatform/store/l1.py: write parsed rows to Parquet partitioned by dataset/date (§4.2), ISIN-keyed,
    both exchanges, raw traded prices ONLY — no adjusted columns (invariant #3). Idempotent per
    (dataset, date): rewriting a partition from L0 produces byte-comparable output. Schema declared once
    and enforced on write; a schema drift fails loud.
    Join delivery data onto prices by (symbol, series, date)→ISIN via M1.7 at write time.
  deliverables: [dataplatform/store/l1.py, dataplatform/store/schemas.py, tests/integration/test_l1_writer.py]
  acceptance:
    - "a date's partition is rebuilt from L0 idempotently (same content on re-run)"
    - "prices_raw has no adjusted-price column and a test asserts that"
    - "every row carries a resolved ISIN; unresolvable rows are quarantined and counted, never dropped silently"
  verify: "uv run pytest tests/integration/test_l1_writer.py -q"

- id: M1.9
  title: Backfill runner (resumable, checkpointed)
  milestone: M1
  module: D1
  autonomy: AUTO
  deps: [M1.3, M1.8, C.2]
  spec: |
    dataplatform/ingest/backfill.py + CLI: backfill a date range for a source set, driving
    fetch→L0→parse→L1→sync_state. Resumable from sync_state (never re-fetch a PUBLISHED date), checkpointed,
    --dry-run that prints the exact request plan and count without fetching, --limit for sampling,
    graceful SIGINT, progress logging, per-source rate limits honoured, hard stop on 403 spike.
    Under B1 the agent may run --limit sampling (~60 sessions across eras) but NOT the full 10-year run.
  deliverables: [dataplatform/ingest/backfill.py, ops/runbooks/backfill.md]
  acceptance:
    - "--dry-run over 10 years prints an accurate request count and never opens a socket"
    - "a sampled run of ~60 sessions spanning both bhavcopy eras completes and lands in L1 with sync_state PUBLISHED"
    - "killing mid-run and restarting resumes without re-fetching completed dates and without gaps"
    - "the runbook documents resume, sampling, and what to do on a 403 hard stop"
