  title: Source register (machine-readable) + live verification sweep
  milestone: C
  module: D1
  autonomy: AUTO
  deps: [M0.1]
  spec: |
    dataplatform/ingest/source_register.yaml — machine-readable mirror of §4.1: one entry per dataset with
    id, url_template, cadence, era ranges, fallback, robots notes, pit notes, status, verified_at,
    last_http_status, sample_bytes, content_type, parser id, required headers.
    Then VERIFY EACH ROW FOR REAL with a single polite request per pattern (2-3s spacing, browser UA,
    Referer https://www.nseindia.com/ for NSE, respect robots): NSE legacy bhavcopy, NSE UDiFF,
    sec_bhavdata_full, BSE bhavcopy, NSE + BSE corp actions, EQUITY_L.csv, BSE scrip master,
    niftyindices constituent CSVs + TRI, FII/DII, bulk/block deals, F&O bhavcopy, announcements feeds,
    GDELT. Flip status to VERIFIED with evidence, or record the exact failure and a candidate alternative.
    Total requests must stay well under the B1 bulk threshold (~one per pattern, ~20 requests).
    AGENTIC_CONTEXT.md §8 records the three NSE patterns already confirmed — re-confirm, don't assume.
  deliverables: [dataplatform/ingest/source_register.yaml, ops/gates/source-verification.md]
  acceptance:
    - "every §4.1 row has an entry; each carries verified_at, last_http_status and sample_bytes or an explicit failure note"
    - "no row is marked VERIFIED without a real successful fetch recorded"
    - "robots.txt was checked per host and the register records what it permits"
  verify: "uv run python -m dataplatform.ingest.source_register validate"

- id: C.2
