- id: M17.7
  title: Daily M17 job — Commons build, managers, staging, marks, scheduler wiring
  milestone: M17
  module: A10
  autonomy: AUTO
  deps: [M17.4, M17.5, M17.6]
  spec: |
    Register a scheduler job that runs after the EOD job is green. The order of work:
    1. interlock (data red, kill switch);
    2. Commons build;
    3. managers sequentially, each in isolation;
    4. control books;
    5. stage for the next open;
    6. after the next session's fills: marks, recon, scoreboard, digest.
    - A manager unfinished by 08:30 IST journals `MISSED_SESSION`.
    - Managers run sequentially by default, so the subscription rate limit is a queue, not a race.
      A rate-limit error backs off and retries inside the deadline.
    - A `--dry-run` flag is honoured (journal stream `m17-dry`), and a `--start S0` flag journals
      every `mandate_hash`.
    - Pre-S0 blockers carried from the M17.1 and M17.5 reports. Every one must be fixed before the
      dry run:
      - extend `backtest/repo_rates.yaml` past 2026-09-29 from RBI's own October 2026 MPC press
        release, with the source quoted as the file does;
      - book corporate actions on M17 books (the paper session's late-action booking);
      - slice an over-participation SELL/TRIM across sessions;
      - land same-evening index and VIX levels and the L2 refresh before the Commons build, or make
        the job wait for them and journal the wait.
    - Amendment 1 (c) and (e): execute declared stops mechanically at the next open, with no model
      call, and journal them as `STOP_EXIT`. Leave a buy into an upper-circuit lock unfilled.
      Forced reviews come first after an integrity event.
    - Restart the user systemd scheduler after registering. Update the runbook
      `ops/runbooks/m17-fund-managers.md`.
  # The composition root is backtest/fm_job.py (+ backtest/fm_world.py, the lake side): it builds the
  # M17 paper accounts, and analyst/ may not name execution.sim_broker. analyst/fundmanager/job.py holds
  # the decision-side pieces only (streams, S0 hashes, deadline, book view, verdict -> orders).
  deliverables: [analyst/fundmanager/job.py, backtest/fm_job.py, backtest/fm_world.py, dataplatform/scheduler/registry.py, ops/runbooks/m17-fund-managers.md, tests/unit/test_fm_job.py]
  acceptance:
    - "a red data day journals SKIPPED_DATA_RED for every manager and stages nothing"
    - "a manager past the deadline journals MISSED_SESSION and the others still run"
    - "make check is green"
  verify: "uv run pytest tests/unit/test_fm_job.py -q"

