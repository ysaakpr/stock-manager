- id: M5.15
  title: Broker session re-auth interlock (AUTH_REQUIRED)
  milestone: M5
  module: X1
  autonomy: AUTO
  deps: [M5.11, M5.12]
  spec: |
    Regulation forces a daily broker API logout with OAuth + 2FA (see ops/compliance/sebi-algo-memo.md,
    NSE consolidated NNF circular INVG/73992 §8.3.2.1.8), so the daily loop can hold a dead session at
    market open. §4.4's interlock covers red data; this covers dead auth — the same failure class of
    acting on an invalid precondition, and until now uncovered.
    Add to the Broker protocol: session_valid() and a SessionExpired error concrete brokers raise. The
    daily loop checks it alongside is_green(): an invalid session journals AUTH_REQUIRED in the same shape
    as SKIPPED_DATA_RED, places zero orders, and alerts once per streak (deduped) with the re-auth
    instruction. SimBroker's session is always valid so paper mode is unaffected — which is exactly why
    this is cheap to build here and expensive to retrofit at M8.
    An AUTH_REQUIRED day must DEFER the day's staged decisions, not silently drop them, with the deferral
    journaled. A decision that evaporates because of an auth failure is a journal lie.
  deliverables: [execution/session.py, analyst/monitor/interlock.py, ops/runbooks/broker-reauth.md, tests/unit/test_auth_interlock.py]
  acceptance:
    - "an invalid broker session produces a journaled AUTH_REQUIRED entry and zero orders (test proves no order path runs)"
    - "paper mode via SimBroker is never blocked by the interlock"
    - "a day's staged decisions are deferred rather than dropped, and the deferral is journaled"
    - "the alert fires once per streak, not once per check"
    - "the runbook tells the owner exactly how to re-authenticate and what the loop does until they do"
  verify: "uv run pytest tests/unit/test_auth_interlock.py -q"

