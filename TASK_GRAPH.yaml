    - "a refused decision's reason codes and messages are on the fm.decision_refused log line, in the journal payload and in the digest's decisions table"
    - "every unfulfilled web request is journaled with its reason and logged; a fetcher returning no pages is logged as a failed fetch"
    - "at most 3 fetches run at once; two concurrent identical requests cost one fetch"
