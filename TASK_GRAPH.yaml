- id: M12.3
  title: Walk-forward the finalists, and the verdict on what the sweep can be asked to prove
  milestone: M12
  module: X2
  autonomy: AUTO
  deps: [M12.2]
  spec: |
    A sweep of twenty arms over one window selects on that window, and the arm that wins a sweep is
    the arm most flattered by it. This is the out-of-sample check and the honest reading.

    Three windows, stated separately and never averaged: the full decade 2016-09 to 2026-08, the
    2019-07 to 2026-08 window the existing ~23% figures came from, and a walk-forward split that
    chooses on 2016-09..2021-08 and verifies on 2021-09..2026-08. The selection window's winner is
    named *before* the verification window is read, and the report prints both ranks so the decay
    from selection to verification is visible rather than inferred.

    The verdict states plainly whether the owner's >25% XIRR bar is met, on which window, on which
    liquidity floor, and at what drawdown — and if it is met only on the flattering window or only
    on the unreachable floor, it says that instead of reporting the number.
