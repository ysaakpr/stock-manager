  deliverables: ["dataplatform/ingest/nse/bhavcopy_legacy.py", dataplatform/ingest/models.py, "tests/fixtures/nse_bhavcopy/legacy/", tests/unit/test_bhavcopy_legacy.py]
  acceptance:
    - "3+ real fixture files across the era parse to identical row schema with Decimal prices"
    - "row counts and a hand-checked sample row match the raw CSV exactly"
    - "malformed/truncated input raises a specific parse error naming the file and line"
  verify: "uv run pytest tests/unit/test_bhavcopy_legacy.py -q"

