  spec: |
    Readiness item (a): D5 made a secret scan mandatory before any real credential (M8.3's Kite key)
    exists on this box; it enforces invariant #13. `ops/secret_scan.py` wraps detect-secrets 1.5.0
    (dev dependency, hash-pinned in `uv.lock`; provider verification stripped, so no network at scan
    time) plus repo plugins (`ops/secret_scan_plugins.py`). It runs as the first recipe line of
    `make check`, as `pre-commit` (`--staged`) and `commit-msg` (`--message`) hooks (`make hooks`),
