- id: M17.4
  title: Fund-manager runtime — bounded research rounds and the decision contract
  milestone: M17
  module: A10
  autonomy: AUTO
  deps: [M17.2, M17.3, M17.9]
  spec: |
    Pre-registration §4 steps 3–4 as extended by §8 Amendment 1 (d), (g). The prompt
    `analyst/fundmanager/prompts/manager.md` v1 already exists (written from
    `ops/studies/m17-analyst-strategy-2026-10-09.md`). Render it. Do not rewrite its guidance. A
    placeholder name may change if the runtime needs it, and the change must be stated in the
    commit body. Enforce in code what it promises:
    - citations `[F:<field_id>]` / `[S:<snapshot_id>]` resolve against the bundle, and an unknown id
      voids the decision;
    - the scenario probabilities sum to 1, and `p_beat_bench` is consistent with them;
    - `edge_type` NONE forces PASS/WATCH/HOLD, and a BUY needs a positive `cost_hurdle_check`;
    - each BUY's stop is within 1.5–3 × ATR and ≤ 15%, and a stop can only tighten;
    - holdings are rendered without cost basis or P&L;
    - only the [[STYLE]] and [[ROUND]] blocks that apply are rendered.
    - `run_manager(mandate, session, commons, book, llm, fetcher)` runs round 0, then at most 2
      research rounds, then the final decision call. Each call is one structured-output schema,
      which is the only shape `ClaudeCliLLM` supports.
    - The research-request schema caps ISINs and queries at the mandate limits. Over-asking is
      truncated, and the truncation is journaled.
    - The decision schema follows pre-registration §4. `SELL`/`TRIM` must carry `what_changed`,
      which is one of `INVALIDATION | STOP | TARGET | BETTER_USE` plus text. `p_beat_bench` is a
      probability in [0, 1].
    - The prompt skeleton lives under `analyst/fundmanager/prompts/`. It gives the manager its
      mandate, its own book and open rationales, the market sheet, the shortlist and the fulfilled
      bundles, and nothing about any other manager.
    - Every input bundle is written to the evidence pack, and every decision to the journal,
      including a whole-session `NO_ACTION` and its reason. Token usage is per call (decision #12).
    - A malformed model output gets one repair retry. After that the session journals
      `MANAGER_ERROR` and stages nothing.
  deliverables: [analyst/fundmanager/runtime.py, analyst/fundmanager/schemas.py, analyst/fundmanager/prompts/manager.md, tests/unit/test_fm_runtime.py]
  acceptance:
    - "an invented citation id, scenarios not summing to 1, an edge_type NONE BUY, or a loosened stop is refused (test each)"
    - "the rendered prompt carries no cost basis or P&L for any holding, and only the manager's own STYLE block"
    - "with StubLLM a full session runs ≤4 calls and journals every decision and the bundle digests"
    - "a SELL without what_changed is refused; p_beat_bench outside [0,1] is refused"
    - "a manager's prompt never contains another manager's id, book or decisions (test over the rendered prompt)"
    - "make check is green"
  verify: "uv run pytest tests/unit/test_fm_runtime.py -q"

