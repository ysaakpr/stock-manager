  autonomy: AUTO
  deps: [M6.7]
  spec: |
    Re-run the fire drill and a sample of T1/T2 reviews against a real model, then assess output
    QUALITY (not just plumbing): are verdicts defensible, are proposed actions sane, is the reasoning
    grounded in the evidence bundle? Record real token costs per decision tier.
    "Real model" means either the Anthropic API or `analyst.llm.claude_cli.ClaudeCliLLM` (`claude -p`
    on this machine's subscription login) — D16, 2026-10-06, since no ANTHROPIC_API_KEY exists here.
    Both satisfy the same `LLM` interface StubLLM does; the report names which one ran. Under the CLI
    there is no per-call bill, so cost is the CLI-reported token counts priced at the model's list
    rate, and the report says it is priced that way rather than invoiced.
    The live test is opt-in behind a registered `live` pytest marker, like `network`: `make check`
    never reaches a model. A live run has a hard call budget of at most 25 model calls; the drill
    counts every call it makes and aborts with a non-zero exit, before the 26th call, rather
    than continue past it. The budget is a constant in the test, not an environment knob.
