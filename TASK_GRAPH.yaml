# Autonomous build DAG for EXECUTION_PLAN.md
# Consumed by orchestrator/ (graph.py). Human-editable; agents append only via `orchestrator split`.
#
# autonomy: AUTO | NEEDS_GO | NEEDS_SECRET | HUMAN_GATE | GATE_AUDIT   (see AGENTIC_CONTEXT.md §4)
# Every task must be sized for one agent context. If it isn't, split it (AGENTIC_CONTEXT.md §7).

version: 1
plan: EXECUTION_PLAN.md
charter: AGENTIC_CONTEXT.md

milestones:
  M0: {title: Foundations, depends: []}
  M1: {title: NSE price core + 10y backfill, depends: [M0]}
  M2: {title: Corporate actions & adjustment engine, depends: [M1]}
  M3: {title: BSE + flows + F&O EOD, depends: [M1]}
  M4: {title: Query service + backtest engine, depends: [M2]}
  M5: {title: Analyst agent v1, paper mode, depends: [M4]}
  M6: {title: Monitoring depth T1/T2 + evidence packs, depends: [M5]}
  M7: {title: Fundamentals waterfall, depends: [M3]}
  M8: {title: Real-money readiness, depends: [M5, M6]}
  M9: {title: Trustworthy backtest inputs + momentum v2, depends: [M2, M3, M4]}
  M10: {title: Alternative signals — sector rotation + fundamentals, depends: [M3, M4, M7, M9]}
  M11: {title: Macro backdrop — PIT economic + market-state series, depends: [M4]}
  M12: {title: Strategy search — short-horizon families and the risk-adjusted comparison,
        depends: [M9, M10]}
  M13: {title: "Run of 2026-10-06 — paper operations, alert triggers, data repairs", depends: [M5, M9, M10]}
  M14: {title: "Follow-ups of the 2026-10-07 M12.R re-run", depends: [M9, M12, M13]}
  M15: {title: "Real-money readiness prerequisites (run of 2026-10-08)", depends: [M5, M6, M13]}
  M16: {title: "Strategy exploration — seven pre-registered arms against D13", depends: [M9, M12, M14]}
  M17: {title: "AI fund managers — forward paper test on a shared Research Commons", depends: [M5, M6, M15]}
  C:  {title: Continuous tracks (no gate), depends: []}

tasks:

