- id: M13.8
  title: L2 invalidation drain never extends an ISIN's history
  milestone: M13
  module: D4
  autonomy: AUTO
  deps: [M2.5]
  spec: |
    L1 reaches back to 2006 but L2 partitions start at 2011-06-22. `rebuild_invalidated` (drained by the
    weekly `ca_refresh` and monthly `bse_ca_sweep`) rebuilt each queued ISIN over its full L1 history,
    which would silently extend L2 into uncurated pre-2011 steps and turn `l2_continuity` red. Floor the
    drain at each ISIN's existing partition start (`materialize_isin(history_floor=…)`, applied to the
    ISIN and every lineage predecessor before adjustment); an ISIN with no partition yet is built as
    the first-time fill builds it. A partition on disk with no rows raises `ValueError` rather than
    silently dropping the floor. The floor is the default (`rebuild_invalidated(floor_existing=True)`);
    the one exception is the lineage rebuild (`dataplatform/identity/lineage_rebuild.py`), which passes
    `floor_existing=False` on purpose so a newly derived edge stitches the predecessor over the full L1
    history. Outside those, extension happens only through `l2_fill --extend`. Log `l2.rebuild_floor`
    per drained ISIN. No live-lake run.
  deliverables: [dataplatform/store/l2.py, dataplatform/identity/lineage_rebuild.py, ops/runbooks/ca_backfill.md, ops/BACKLOG.md, tests/unit/test_l2_drain_floor.py]
  acceptance:
    - "a queued ISIN with L1 to 2006 and L2 from 2011 is rebuilt from its partition start only, byte-identical to the partition on disk, and the invalidation is resolved"
    - "lineage stitching respects the floor; a brand-new ISIN matches materialize_missing"
    - "--extend still extends to 2006 after a drain"
    - "dropping or inverting the floor fails the tests"
    - "the lineage rebuild drains with floor_existing=False and stitches the predecessor's full history; a test pins the call-site argument"
    - "a zero-row partition on disk raises instead of dropping the floor; a test pins it"
  verify: "uv run pytest tests/unit/test_l2_drain_floor.py -q"

