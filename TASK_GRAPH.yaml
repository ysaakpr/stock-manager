  spec: |
    One migration (the next free number on main) creates `commons_market_sheet`,
    `commons_universe_sheet` and `commons_build`. Each row is keyed by `trading_date` and the build
    digest, and is append-only: a rebuild writes a new build and never updates an old row.
    - Market sheet, through the query service only: NIFTY 50/500 trend versus the 50/200-session
      means, breadth (the share of the universe above its 50-session mean, advance/decline),
