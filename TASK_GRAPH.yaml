- id: M3.9.a
  title: Index constituents history (monthly snapshots, PIT membership)
  milestone: M3
  module: D1
  autonomy: AUTO
  deps: [M1.2, M1.7]
  spec: |
    Ingest niftyindices constituent CSVs (NIFTY 50, sectoral, thematic) as monthly snapshots — constituent
    history accumulates from day one (§4.1) and is what kills survivorship bias in M4's PIT universe.
    Snapshot semantics: never overwrite a prior month's membership.
    Source: `nifty_index_constituents` (§4.1 row 7).
  deliverables: [dataplatform/ingest/indices.py, tests/unit/test_indices.py]
  acceptance:
    - "a monthly snapshot is stored immutably with its as-of date"
    - "membership as-of a historical date is queryable and returns the snapshot in force then"
  verify: "uv run pytest tests/unit/test_indices.py -q"

- id: M3.9.b
  title: Benchmark TRI ingest — the published NIFTY total-return series
  milestone: M3
  module: D1
  autonomy: AUTO
  deps: [M1.2, M1.7]
  spec: |
    Ingest the *published* NIFTY total-return series (§4.1 row 8, `nifty_tri_history`) for NIFTY 50,
    NIFTY IT and NIFTY CPSE at maximum depth: `POST https://niftyindices.com/BackPage/getTotalReturnIndexString`
    with the `cinfo` string envelope — one request per index for its whole history, no session cookie,
    no Referer, no key. The pre-D8 register recorded this row FAILED against `Backpage.aspx/...`, a
    stale path that answers 200 with the site's home page; D8 corrected it.
    Land L0 (immutable, sidecar receipt) -> parse -> L1 `benchmark_tri` -> `sync_state`, per index.
    Three observed parser traps are part of the contract, not folklore: rows arrive newest-first;
    index names are sent in CAPS and echo back title-cased, so the lake slug comes from the requested
    name; and `RequestNumber` regenerates per request, so nothing derived from the payload may carry it.
    `knowable_date` is a pure function of each row's own published session date (the exchange
    disseminates a session's TRI after that session's close) — never `clock.now().date()`, which is
