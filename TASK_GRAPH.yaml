- id: M0.1
  title: uv project skeleton, package layout, quality gate
  milestone: M0
  module: "—"
  autonomy: AUTO
  deps: []
  spec: |
    Create the Python 3.12 project with uv. pyproject.toml with deps: fastapi, uvicorn, pydantic,
    pydantic-settings, structlog, httpx, polars OR pandas+pyarrow (pick pandas+pyarrow — boring, #13),
    duckdb, psycopg[binary], apscheduler, typer, pyyaml, tenacity; dev: pytest, pytest-cov, ruff, mypy,
    types-pyyaml, freezegun, yfinance (test-only, for the M2 reference harness).
    Create every package dir from CLAUDE.md layout with __init__.py and a one-line module docstring naming
    its plan ID (e.g. "D1: ingestion + source register").
    Makefile targets: check (ruff format --check, ruff check, mypy, pytest), fmt, test, up, down, migrate,
    backup, restore. .gitignore covering data/, .env, __pycache__, .venv, *.parquet, .duckdb.
    ruff + mypy config in pyproject (line-length 100, strict-ish mypy, per-package overrides allowed).
  deliverables: [pyproject.toml, uv.lock, Makefile, .gitignore, "dataplatform/**/__init__.py", "analyst/**/__init__.py", tests/conftest.py]
  acceptance:
    - "uv sync creates a 3.12 venv and resolves the lock"
    - "make check passes on the empty skeleton (zero lint errors, mypy clean, pytest collects 0-or-more with no errors)"
    - "every package/subpackage in CLAUDE.md's layout exists with a docstring naming its plan module ID"
  verify: "uv run python -c 'import sys; assert sys.version_info[:2]==(3,12)' && make check"

- id: M0.2
  title: Config, logging, clock, path layout
  milestone: M0
  module: "—"
  autonomy: AUTO
  deps: [M0.1]
  spec: |
    dataplatform/config.py: pydantic-settings Settings reading .env — DB url, DATA_ROOT, timezone
    (Asia/Kolkata), rate limits, LLM/broker provider selectors ("stub" default per B4), log level.
    dataplatform/logging.py: structlog setup, JSON in prod / console in dev, bound context helper.
    dataplatform/clock.py: Clock protocol + SystemClock + FrozenClock (B10). NOTHING in the codebase may call
    datetime.now() after this exists — add a ruff/grep-based guard in tests asserting no direct
    datetime.now()/date.today() outside dataplatform/clock.py.
    dataplatform/store/paths.py: L0/L1/L2 path builders — L0 as
    data/L0/{source}/{yyyy}/{mm}/{filename}, L1 as data/L1/{dataset}/date={yyyy-mm-dd}/part.parquet, L2 mirror.
    .env.example with every key documented and no real values.
  deliverables: [dataplatform/config.py, dataplatform/logging.py, dataplatform/clock.py, dataplatform/store/paths.py, .env.example, tests/unit/test_clock_guard.py]
  acceptance:
    - "Settings loads from .env.example values with no network or DB access"
    - "FrozenClock makes a time-dependent function deterministic in a test"
    - "the clock guard test fails if a datetime.now() call is introduced anywhere outside dataplatform/clock.py (prove by temporarily adding one in the test)"
  verify: "uv run pytest tests/unit/test_clock_guard.py -q && make check"

- id: M0.3
  title: docker-compose stack + Dockerfile
  milestone: M0
  module: "—"
  autonomy: AUTO
  deps: [M0.1]
  spec: |
    ops/docker-compose.yml: postgres:16 (named volume, healthcheck, port 5432) + app service building
    ops/Dockerfile (python:3.12-slim, uv-based install, non-root user, runs the FastAPI status API).
