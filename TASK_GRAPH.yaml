# ─────────────────────────────────────────────────────────────────────────────
# M12 — Strategy search (short-horizon families + the risk-adjusted comparison)
# ─────────────────────────────────────────────────────────────────────────────

- id: M12.1
  title: Widen the swing engine — six new signal legs and a regime gate, defaults unchanged
  milestone: M12
  module: X2
  autonomy: AUTO
  deps: [M10.7]
  spec: |
    M10.7 built a swing engine whose entry score is a weighted sum of rank-normalised legs, and
    wired exactly three legs into it. The engine generalises for free; the legs do not exist. This
    adds the ones the lake already carries and no policy reads, as *signed* weights so one leg can
    be asked for its reverse:

      * `return_5` — the 5-session return, for the short-term reversal family (a negative weight).
        The one classical short-horizon effect nothing here has measured.
      * `momentum_1m` — the 21-session return, the swing horizon's own trend, distinct from 12-1.
      * `delivery_trend` — the 5-session delivery mean over its 63-session mean. The *acceleration*
        of delivery, where M10.7's leg is its level; the largest name-level coefficient in X2's
        fitted forecast.
      * `turnover_expansion` — 5-session mean traded value over its 63-session mean.
      * `ma_proximity` — close over its own 50-session mean.
      * `volatility` as a scored leg, not only the screen it already is.

    Plus a `regime_filter` gate of the shape momentum v2 already carries (M9.5): no new buys while
    the broad market sits below its own 200-session mean. It is the largest drawdown lever measured
    on this lake and the swing policy has no access to it.

    Every new weight defaults to zero and the gate defaults off, so the default arm must reproduce
    M10.7's measurement to the digit — that is the acceptance criterion, not a nicety. The features
    join the one existing bulk windowed query rather than adding a pass over the lake.
  deliverables: [backtest/policies/swing_composite.py, backtest/run.py, tests/unit/test_swing_composite.py]
  acceptance:
    - "every new leg defaults to weight zero and the default arm's run digest is unchanged against
       M10.7's — proven by a test, not by inspection"
    - "each new leg is pinned by an inversion test: flip the sign of its weight and a test fails"
    - "the regime gate blocks buys and never blocks an exit; a test pins both directions"
    - "every new feature window is ROWS BETWEEN n PRECEDING AND CURRENT ROW and no new pass over
       the lake is added"
  verify: "uv run pytest tests/unit/test_swing_composite.py -q"

- id: M12.2
  title: The strategy sweep runner — many arms, one lake pass, ranked on return per drawdown
  milestone: M12
  module: X2
  autonomy: AUTO
  deps: [M12.1]
  spec: |
    Every comparison report here re-reads the lake once per arm, which is why no report has ever
    carried more than fourteen. A twenty-arm sweep at that cost is hours of repeated I/O for one
    windowed query that does not change between arms. This builds the runner that reads once and
    replays many.

    The arms are the strategy families, not parameter noise: the two momentum baselines, the
    fundamentals arms, the M10.7 swing family, and the short-horizon families M12.1's legs make
    expressible — reversal, delivery acceleration, 1-month trend, breakout, and the regime-gated
    and concentrated editions of each.

    Ranking is on **return per unit of drawdown** (XIRR / max drawdown), by owner decision
    2026-09-07, with XIRR, drawdown, round trips, cost and benchmark excess all reported beside it.
    A ranking on return alone puts a 45%-drawdown arm first and is the reason this decision exists.

    Each arm runs on two liquidity floors — the inherited Rs 1 crore median-turnover floor for
