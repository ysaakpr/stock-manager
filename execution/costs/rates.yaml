      - "Karnataka Stamp Act 1957, contract-note article — ₹1 for every ₹10,000 of the value of
         the securities, i.e. 0.01%."
      - "Zerodha's published DP charge of the period: ₹13.5 + GST per scrip on the sell side
         (₹5.5 depository + ₹8 broker)."
    notes: >-
      The exchange transaction and SEBI turnover rates here are the figures Zerodha published in
      this period (NSE 0.00325%, BSE 0.00275%, SEBI ₹15/crore); no primary rate card of a 2018
      date was read, and no capped state (Telangana, Haryana) is encoded — an unlisted state
      raises. On a ₹50,000 trade the whole exchange+SEBI block is under ₹2, so a residual error
      here is paise, while getting the stamp-duty side wrong (both sides, not buy-only) would be
      rupees — that part is sourced.
    brokerage_per_order: "0"
    stt:
      buy_rate: "0.001"
      sell_rate: "0.001"
    exchange_transaction:
      NSE: "0.0000325"
      BSE: "0.0000275"
    sebi_turnover_rate: "0.0000015"
    gst:
      rate: "0.18"
      # The published formula of this era was "18% on (brokerage + transaction charges)"; the SEBI
      # turnover fee entered the GST base later (see the 2025-04-01 schedule).
      applies_to: [brokerage, exchange_transaction]
    stamp_duty:
      regime: state
      sides: [BUY, SELL]
      state_rates:
        KA: "0.0001"
        MH: "0.0001"
    dp_charge:
      depository_fee: "5.50"
      broker_fee: "8.00"
      gst_applies: true

