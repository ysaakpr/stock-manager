# Indian delivery-equity transaction costs, as a dated rate card (M4.4).
#
# One schedule per rate regime, in ascending `effective_from` order. A trade is charged with the
# last schedule whose `effective_from` is on or before its trade date, so a 2018 backtest pays 2018
# rates and today's SimBroker pays today's. A trade before the first schedule raises rather than
# borrowing a later rate card — a backtest silently priced with rates that did not exist yet is the
# failure this file exists to prevent.
#
# Every rate is a QUOTED STRING. YAML would parse a bare 0.0000307 as a float, and a float in the
# cost model is a bug (CLAUDE.md); `execution/costs/model.py` rejects one, and
# `tests/unit/test_costs.py` asserts no unquoted number survives in this file.
#
# Rates are fractions of turnover unless the key says otherwise. ₹15 per crore is "0.0000015".
#
# `provenance` on each schedule:
#   verified     — every number read off the cited primary source on `sources_read_on`.
#   reconstructed — the regime is real and the rates are the published figures of the period as
#                  reported by the cited sources, but no primary rate card of that date was read.
#                  Materiality of any error is noted per schedule.
#
# **The card was extended back to 2006-01-01 by W0-7 (2026-09-08).** It previously started at
# 2017-07-01, which left roughly ten months of the existing lake (2016-09-01 onwards) unpriceable:
# a full-span backtest raised `NoRateScheduleError` on its first fill. Ten schedules now cover
# 2006-2017, and every one of their boundaries is a statutory date — a service-tax notification or
# a Finance Act STT substitution — not a convenience split.
#
# Two things about that block are easy to misread and are spelled out in `service-tax-10-2`'s
# `notes`, which the whole block refers back to:
#
#   * **`gst:` holds the *service-tax* rate before 2017-07-01.** The field is the schema's name for
#     "the ad-valorem tax on the fee lines"; before GST that tax was service tax plus its cesses,
#     folded into one effective rate on the same base (brokerage + transaction charges). No code
#     branches on the name and no schema was invented for it.
#   * **`brokerage_per_order: "0"` is this card's semantics, not a 2006 fact.** The card prices our
#     execution at a modern zero-brokerage broker against the statutory rates of the day. Zerodha
#     did not exist before August 2010 and charged "0.1% or ₹20/trade, whichever is lower" on
#     delivery until 2015-16; `brokerage_per_order` is a flat amount and cannot express that rule
#     at all. A pre-2016 result is statutory-and-exchange cost drag, not what a 2006 retail
#     investor paid.

version: 1

card:
  broker: zerodha
  segment: equity_delivery
  currency: INR
  scope: >-
    Delivery equity on NSE and BSE only. Intraday, F&O, currency and commodity have a different
    rate card and are deliberately absent: add them here, never in a second module (invariant #4).

schedules:
  # ── 2006-01-01 ─────────────────────────────────────────────────────────────────────────────
  - id: service-tax-10-2
    effective_from: "2006-01-01"
    label: Pre-GST — service tax 10.2% on brokerage + transaction charges; STT 0.1% both legs
    provenance: reconstructed
    sources_read_on: "2026-09-08"
    sources:
      - "Service tax: 10% + 2% education cess = 10.20% effective, in force 2004-09-10 to
         2006-04-17 — http://www.simpletaxindia.in/history-of-service-tax-rates/ (read
         2026-09-08), whose table gives every rate with its effective date."
      - "STT: Chapter VII of the Finance (No. 2) Act 2004, s.98. Delivery-based purchase and
         delivery-based sale of an equity share were each 0.075% from 2004-10-01; the Finance Act
         2005 substituted 0.1% with effect from 2005-06-01. Rate table and substitution footnotes:
         https://www.taxmann.com/bookstore/bookshop/bookfiles/STTCTTELRsamplechapter.pdf"
      - "Stamp duty (state era, both legs): Karnataka Stamp Act 1957, contract-note article — ₹1
         for every ₹10,000 of the value of the securities, i.e. 0.01%, subject to a maximum of ₹50
         per contract note. The ₹50 cap is confirmed by Zerodha's own charge list
         (`ZerodhaChargeList.xls`, last saved 2012-04-24, archived at
         web.archive.org/web/20120504125926): \"Stamp Charges — 0.01% subject to a maximum of
         Rs 50\". Both-legs collection pre-2020-07-01:
         https://zerodha.com/z-connect/general/uniform-stamp-duty"
    notes: >-
      **Where the eras come from.** Every `effective_from` in the 2006-2017 block is a statutory
      date — a service-tax notification or a Finance Act STT substitution — never a convenience
      boundary. The two statutory series are the only things that move across these ten schedules.

      **`gst:` carries the service-tax rate here.** Before 2017-07-01 the ad-valorem tax on the fee
      lines was service tax plus its cesses, not GST. The field is named `gst` because that is the
      schema's name for "the ad-valorem tax on the fee lines"; the *rate* is the era's effective
      service-tax rate and the base is the same (brokerage + transaction charges), which is what
      Zerodha's own cards of the period state verbatim. No code branches on the name.

      **What is carried back rather than sourced to this date.** The exchange transaction rates
      (NSE 0.00325%, BSE 0.00325%) and the SEBI turnover fee (₹10/crore) are the earliest figures
      for which a primary card was located — Zerodha's charge list captured 2014-05-04. No
      per-exchange rate card of a 2006-2013 date was found, so they are carried back. On a ₹50,000
      trade the whole exchange + SEBI + service-tax block is ₹1.88; the residual error there is
      paise, while STT (₹50-63) and stamp duty (₹5 a leg) are sourced to the statute.

      **Brokerage is 0, and that is a modelling choice, not a 2006 fact.** This card prices *our*
      execution at a modern zero-brokerage broker against the statutory rates of the day. Zerodha
      did not exist until August 2010, and its own delivery brokerage was "0.1% or ₹20 per trade,
      whichever is lower" until free delivery arrived between 2015-10-03 and 2016-06-23 (both dates
      are archived Zerodha cards). `brokerage_per_order` is a flat amount and cannot express a
      min(percentage, cap) rule at all, so a pre-2016 backtest run off this card understates
      brokerage — by up to ₹20 an order for 2010-2015, and by a full-service percentage before
      that. Read a long-horizon result as statutory-and-exchange cost drag, not as what a 2006
      retail investor actually paid.

      **The ₹50 Karnataka stamp cap is not modelled** — `StampDuty` has no cap field. It binds
      above ₹5,00,000 of turnover per contract note, above which this card overstates KA duty.
    brokerage_per_order: "0"
    stt:
      buy_rate: "0.001"
      sell_rate: "0.001"
    exchange_transaction:
      NSE: "0.0000325"
      BSE: "0.0000325"
    sebi_turnover_rate: "0.000001"
    gst:
      # Service tax 10% + 2% education cess. Not GST — see `notes`.
      rate: "0.102"
      applies_to: [brokerage, exchange_transaction]
    stamp_duty:
      regime: state
      sides: [BUY, SELL]
      state_rates:
        KA: "0.0001"
        MH: "0.0001"
    dp_charge:
      depository_fee: "5.50"
      broker_fee: "8.00"
      gst_applies: true

