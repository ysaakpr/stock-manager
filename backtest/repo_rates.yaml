# RBI policy repo rate, as a dated schedule — what idle backtest cash earns (X2 cash interest).
#
# Uninvested, *settled* cash in a backtest earns (repo rate - 0.50%) a year, accrued daily and
# credited monthly (`backtest/cash_interest.py` states the convention). The 50 bp haircut is fixed
# in code, not configured here: this file holds facts, never a tunable.
#
# One row per change of the policy (LAF) repo rate, in ascending `effective_from` order. A day is
# priced at the last row whose `effective_from` is on or before it. A day outside
# [`coverage.from`, `coverage.through`] RAISES `RepoRateCoverageError` — no row is ever borrowed
# for a date it was not in force, and a run past `through` fails until someone extends this file
# (after checking whether the MPC has moved the rate since).
#
# Carry-forward (owner decision 2026-10-10): `through` may run past `confirmed_through` up to the
# day BEFORE the next scheduled MPC decision, citing the RBI release that schedules it. The repo
# rate changes only at an MPC decision, so the latest row is in force until then barring an
# unscheduled meeting (the last was May 2020). The loader refuses a carried `through` on or after
# `next_mpc_decision`. After each decision: read RBI's release, add its row, move all four dates.
#
# Every rate is a QUOTED STRING, in per cent as RBI quotes it. YAML would parse a bare 6.25 as a
# float, and the loader rejects one (CLAUDE.md: money-adjacent figures are Decimal).
#
# `provenance` per row:
#   verified      — the rate and its effective date were read off the cited rbi.org.in page.
#   reconstructed — the change is real and dated as RBI announced it, but the RBI page itself was
#                   not read (rbidocs.rbi.org.in serves a CAPTCHA to automated readers, and it is
#                   not evaded; a secondary timeline returned 403). Every row except the latest two is
#                   reconstructed as of 2026-10-09: upgrade a row only by reading its RBI release. Materiality: an effective date off by a day moves a year's
#                   interest by ~1/365 of 25 bp — immaterial against any backtest figure.
#
# Before 2011-05-03 the "repo rate" is the LAF repo rate of the corridor era (RBI then quoted a
# repo and a reverse-repo); from 2011-05-03 the repo rate is the single policy rate. The row is
# the rate at which RBI lent; which rate a sweep account tracks is not modelled.

version: 1

haircut_note: >-
  Earning rate = repo - 0.50% per annum, fixed in backtest/cash_interest.py (HAIRCUT). Not a
  parameter: changing it is a change of measurement, reviewed as code.

coverage:
  from: "2006-01-01"
  # The last date on which the latest row was confirmed still in force: https://www.rbi.org.in/
  # read 2026-10-09 shows "Policy Repo Rate : 5.50%" (the 5-7 Oct 2026 MPC raised it; the Feb,
  # Apr, Jun and Aug 2026 MPCs had held at 5.25%). The next MPC meets 2-4 Dec 2026; extend
  # `through` past that only after checking its decision.
  confirmed_through: "2026-10-09"
  # Carried forward to the eve of the next scheduled decision. RBI's 2026-10-07 release
  # (prid=63742, read 2026-10-10): "The next meeting of the MPC is scheduled for December 2 to 4,
  # 2026." The decision is announced on the 4th and takes effect that day, so the 4th is not
  # covered: a session on or after 2026-12-04 raises until this file is updated.
  next_mpc_decision: "2026-12-04"
  through: "2026-12-03"
  read_on: "2026-10-10"

