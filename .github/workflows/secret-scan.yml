---
# Secret scanning is the enforceable half of invariant #13 (AGENTIC_CONTEXT §6) — this repo is
# public, so a credential that reaches a pushed commit is compromised the instant it lands, and
# `make check` alone only helps if someone runs it before pushing. This workflow is the backstop.
#
# Scoped to the scan alone, not the full `make check`: the rest of the gate (format/lint/types/
# tests) is a separate concern with its own pre-existing failures on unrelated files (see
# AGENTIC_CONTEXT and the task history) — this workflow must not block on those.
#
# KNOWN GAP, accepted rather than papered over: `actions/checkout` here takes the default shallow
# depth, and detect-secrets scans a snapshot of the working tree, not commit history. A secret
# added in one pushed commit and removed in a later commit in the same push would never appear in
# the final tree and this job would not catch it — the history is still published (a push sends
# every commit object, not just the final state) and the secret is still compromised. Closing this
# needs a history/diff-aware scanner (gitleaks, trufflehog), a different tool than the snapshot
# scanner this task set up; recorded here rather than attempted as a bolt-on.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # --locked: CI must fail if uv.lock drifts from pyproject.toml, not silently re-resolve.
      - name: Sync the pinned dev environment
        run: uv sync --locked

      # -n/--no-verify: several plugins otherwise place a live network call to the credential's
      # provider (Telegram, Stripe, GitHub...), and a secret that fails that call — a planted test
      # secret, or a real one already rotated — reads as "verified false" and is silently hidden.
      # That is exactly backwards for a leak scanner (see the Makefile's `check` target).
      #
      # --disable-filter .../is_line_allowlisted: a `# pragma: allowlist secret` comment is not a
      # review — it has no entry in .secrets.baseline and no diff anyone looks at.
      - name: Scan for secrets against the audited baseline
        run: >-
          uv run detect-secrets-hook -n
          --disable-filter detect_secrets.filters.allowlist.is_line_allowlisted
          --baseline .secrets.baseline $(git ls-files)
