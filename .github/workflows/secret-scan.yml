---
# Secret scanning is the enforceable half of invariant #13 (AGENTIC_CONTEXT §6) — this repo is
# public, so a credential that reaches a pushed commit is compromised the instant it lands, and
# `make check` alone only helps if someone runs it before pushing. This workflow is the backstop.
#
# Scoped to the scan alone, not the full `make check`: the rest of the gate (format/lint/types/
# tests) is a separate concern with its own pre-existing failures on unrelated files (see
# AGENTIC_CONTEXT and the task history) — this workflow must not block on those.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # --locked: CI must fail if uv.lock drifts from pyproject.toml, not silently re-resolve.
      - name: Sync the pinned dev environment
        run: uv sync --locked

      # -n/--no-verify: several plugins otherwise place a live network call to the credential's
      # provider (Telegram, Stripe, GitHub...), and a secret that fails that call — a planted test
      # secret, or a real one already rotated — reads as "verified false" and is silently hidden.
      # That is exactly backwards for a leak scanner (see the Makefile's `check` target).
      - name: Scan for secrets against the audited baseline
        run: uv run detect-secrets-hook -n --baseline .secrets.baseline $(git ls-files)
