# Secret scan of every commit a PR or a push to main adds (M15.1, AGENTIC_CONTEXT §6 invariant #13,
# HUMAN_DECISIONS D5). The repo is public, so a credential in ANY pushed commit is published, even
# one a later commit deletes. `make check` (ci.yml) scans the final tree; this scans each commit's
# own blobs and its message, so add-then-delete is caught too. Offline: detect-secrets from uv.lock,
# no verification calls. Runbook: ops/runbooks/secret-scan.md.
#
# Its own workflow, with NO concurrency group: ci.yml cancels an in-flight run when a newer push
# lands, and a cancelled scan of commits main has already published is a scan that never happened.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (every commit in the PR / push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — the scan walks the commit range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv (pinned Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Scan the commits this event adds
        # SHAs pass through env, never interpolated into the script body.
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # main created from nothing: there is no base to diff against. Fail loudly rather
            # than scan a guess; scan it by hand (ops/runbooks/secret-scan.md) and re-run.
            echo "::error::push has no 'before' commit; no range to scan"
            exit 2
          fi
          echo "scanning $range"
          uv run python ops/secret_scan.py --commits "$range"
